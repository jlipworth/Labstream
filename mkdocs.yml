site_name: Labstream
site_description: Native Apple-platform client for your own Plex, Jellyfin, or Emby server.
site_url: https://jlipworth.github.io/Labstream/
repo_url: https://github.com/jlipworth/Labstream
repo_name: jlipworth/Labstream
docs_dir: docs
copyright: Copyright (C) 2026 Jonathan Lipworth — GPL-3.0 with §7 exception

theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, toc.follow, search.suggest]
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-night, name: Switch to light }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-sunny, name: Switch to dark }

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }

exclude_docs: |
  research/
  proposals/
  archive/
  superpowers/
  profiling/baselines/

nav:
  - Home: index.md
  - User guide:
      - Support & troubleshooting: support.md
      - Report a bug: REPORTING-BUGS.md
      - Privacy policy: privacy.md
      - License exception: app-store-exception.md
  - Developer guide:
      - Contributing: CONTRIBUTING.md
      - Development setup: DEVELOPMENT.md
      - Testing strategy: TESTING-STRATEGY.md
      - iOS and iPadOS target: MOBILE-IOS.md
      - Scripts catalog: SCRIPTS.md
  - Architecture:
      - Overview: ARCHITECTURE.md
      - Code map: CODE-MAP.md
      - Backends: BACKENDS.md
      - Playback: PLAYBACK-ARCHITECTURE.md
      - Downloads & offline: DOWNLOADS-OFFLINE.md
      - Music: MUSIC-DESIGN.md
      - Persistence: PERSISTENCE.md
      - System integration: SYSTEM-INTEGRATION.md
      - Diagnostics & privacy: DIAGNOSTICS-PRIVACY.md
