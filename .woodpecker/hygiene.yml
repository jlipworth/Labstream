# .woodpecker/hygiene.yml
# Repo hygiene checks that do not require Apple signing credentials or a macOS runner.

when:
  event: [push, pull_request, manual]

steps:
  - name: repo-hygiene
    image: alpine:3.24
    commands:
      - apk add --no-cache bash git ripgrep python3 py3-pip
      - pip install --break-system-packages uv
      - python3 scripts/validate-macos-pipeline.py .woodpecker/macos.yml --default-branch main
      - ./scripts/ci-hygiene.sh
