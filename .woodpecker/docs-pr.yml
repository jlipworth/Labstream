# .woodpecker/docs-pr.yml
# Build public documentation for pull requests without deployment credentials.
when:
  - event: pull_request
    path:
      include: [docs/**, "*.md", scripts/check-doc-links.py, scripts/check-docs-mermaid.py, mkdocs.yml, requirements.txt, .woodpecker/docs-pr.yml]

steps:
  - name: build-docs
    image: python:3.12-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git
      - rm -rf /var/lib/apt/lists/*
      - pip install --no-cache-dir -r requirements.txt
      - mkdocs build --strict
      - python scripts/check-doc-links.py
      - python scripts/check-docs-mermaid.py
