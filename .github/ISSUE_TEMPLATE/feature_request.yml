name: Feature request
description: Suggest an enhancement or new capability for Labstream.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Labstream is a personal-use Apple-platform client for your own
        Plex / Jellyfin / Emby server, so requests that fit that scope are most likely
        to land. For broader discussion or questions, consider
        [Discussions](https://github.com/jlipworth/Labstream/discussions) instead.

        Everything submitted here will be public. Do not include access tokens, client
        identifiers, server names/URLs/IPs, usernames, private media titles or paths, or
        unreviewed logs. Security vulnerabilities must use the private reporting link.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or the frustration, not just the solution.
      placeholder: When I'm on a long flight I can't tell which downloads are fully offline-ready.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Labstream to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Playback
        - Downloads / offline
        - Browse / search / library
        - Music
        - Subtitles
        - Sign-in / account
        - Cinema / immersive
        - Other
    validations:
      required: false
  - type: checkboxes
    id: privacy-ack
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this request and removed credentials, server details, usernames, private media information, and unreviewed logs.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you've tried, or other apps that handle this well.
    validations:
      required: false
