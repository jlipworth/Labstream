    url: https://github.com/jlipworth/Labstream/security/advisories/new
    about: Never post vulnerabilities, credentials, server details, or unreviewed logs in a public issue.
  - name: Support & troubleshooting
    url: https://github.com/jlipworth/Labstream/blob/main/SUPPORT.md
    about: Requirements, getting started, and answers to common playback / sign-in / remote-access questions. Check here first.
  - name: How to report a bug (with a redacted diagnostic report)
    url: https://github.com/jlipworth/Labstream/blob/main/docs/REPORTING-BUGS.md
    about: Step-by-step guide to capturing a privacy-safe diagnostic report before you open a bug.
  - name: Ideas and wishlist
    url: https://github.com/jlipworth/Labstream/discussions/categories/ideas
    about: Open-ended ideas and feature brainstorming. Use the feature request form only for a concrete, scoped change.
  - name: Questions & help
    url: https://github.com/jlipworth/Labstream/discussions/categories/q-a
    about: Setup, usage, and "is this expected?" questions that aren't a confirmed bug.
