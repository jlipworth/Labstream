name: Bug report
description: Report a problem with Labstream (playback, downloads, browse, music, subtitles, …).
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        Labstream has no developer-operated backend and does not automatically send
        diagnostics to the developer, so this issue is what we'll see — please
        give us enough to reproduce it. The fastest, safest way to share context is the
        built-in **diagnostic report** (Settings ▸ Diagnostics), which is redacted for
        you. See the field near the bottom of this form.

        Before filing, a quick scan of the [Support guide](https://github.com/jlipworth/Labstream/blob/main/SUPPORT.md)
        may already answer common playback / sign-in / remote-access questions, and a quick
        [search of existing issues](https://github.com/jlipworth/Labstream/issues?q=is%3Aissue)
        avoids duplicates — if one matches, add your details there instead.
        Using a coding agent to help? Point it at the
        [triage playbook](https://github.com/jlipworth/Labstream/blob/main/.github/triage/PLAYBOOK.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the problem.
      placeholder: When I play a 4K HEVC movie over remote access, the screen stays black and the spinner never clears.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Playback should start (or fall back to a transcoded stream).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Number the steps so we can follow them exactly.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Media backend
      description: Which server were you connected to?
      options:
        - Plex
        - Jellyfin
        - Emby
        - Not sure / not relevant
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which device(s) show the problem? Select every one you have reproduced it on.
      multiple: true
      options:
        - Apple Vision Pro
        - iPhone
        - iPad
        - Apple TV
        - Mac
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How badly does this affect you?
      options:
        - Blocker — crash, can't sign in, or nothing plays
        - Major — a feature is broken with no workaround
        - Moderate — broken, but there is a workaround
        - Minor — cosmetic or occasional annoyance
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the app does this involve?
      options:
        - Playback (streaming)
        - Downloads / offline
        - Browse / search / library
        - Music
        - Subtitles
        - Sign-in / account
        - Other
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Labstream version and build
      description: >
        In Labstream, open Settings and scroll to the About section at the bottom; copy the
        Version and Build values (and Build ID, if shown). Example: 1.2.0 (1). Also say
        whether you installed from the App Store, TestFlight, or a source build.
      placeholder: "1.2.0 (1), App Store"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Device and OS version
      description: "Device model and OS version. Labstream's Settings ▸ About shows the OS line; otherwise use the system Settings ▸ General ▸ About (or About This Mac). Examples: Apple Vision Pro, visionOS 26.5; iPhone 16, iOS 26.5; Apple TV 4K, tvOS 26.5; MacBook Pro, macOS 26.5."
      placeholder: "Apple Vision Pro, visionOS 26.5"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server type and version
      description: >
        The server product and version, if you know it (Settings ▸ About shows the
        connected server's version). Do NOT include your server's name, URL, or IP.
      placeholder: "Plex Media Server 1.40.x  /  Jellyfin 10.9.x  /  Emby 4.8.x"
    validations:
      required: false
  - type: textarea
    id: diagnostic-report
    attributes:
      label: Diagnostic report (redacted)
      description: >
        In the app, go to **Settings ▸ Diagnostics**, turn on **Enable diagnostic
        logging**, reproduce the problem once, then tap **Send feedback to developer**
        (or **Copy diagnostic report** on visionOS, iPhone, iPad, or Mac) and paste
        it here. Copy and Export are not available on Apple TV; use Send feedback
        or Open a GitHub issue and review the on-screen preview. The report is
        automatically redacted — it omits tokens, client identifiers, hostnames/IP
        addresses, full URLs, usernames, library paths, filenames, and media titles.
        See the
        [Report a bug guide](https://github.com/jlipworth/Labstream/blob/main/docs/REPORTING-BUGS.md)
        for the full walkthrough. Optional, but it greatly speeds up a fix.
      render: text
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >
        Screenshots, video, frequency (always / sometimes), whether it's new since an
        update, etc. Please make sure any screenshot or video does not reveal your
        server address or media titles if you'd rather keep them private.
    validations:
      required: false
  - type: checkboxes
    id: privacy-ack
    attributes:
      label: Privacy check
      description: This repository is public — everything in this issue is publicly visible.
      options:
        - label: >
            I have reviewed everything I'm submitting (including the diagnostic report,
            screenshots, and any logs) and removed anything I don't want public — in
            particular tokens, my server's name/URL/IP, usernames, and media titles.
          required: true
