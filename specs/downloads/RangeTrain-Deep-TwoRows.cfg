\* SPEC: DownloadsRangeTrain
\* EXPECT: pass
\* TIER: deep
\* The code as it stands, two static rows of two segments sharing the process, with SYMMETRY
\* over the rows. About 4.2 million distinct states and three and a half minutes at TLC_WORKERS=2.
SPECIFICATION Spec
SYMMETRY RowSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    NSeg = 2
    Depth = 2
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = FALSE
    AllowFailure = FALSE
    ForegroundReattach = TRUE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANTS
    TypeOK
    AppendsAligned
    StaleTrainBodyInert
    QueuedBodyNotSwept
    HeldBodyNotSweptBeforeManifest
    ManifestedBodyExists
    HeldBodyExists
    FinalizingHasBody
    CompleteIsWhole
PROPERTIES
    PlannerRespectsDepth
    CheckpointNeverDiscarded
    NoStartWhileUserPaused
    PauseKeepsHeldBodies
