    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    IntervalAwarePlan = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = FALSE
    FixSnapshotOwnedWork = FALSE
    FixHeadGapPlanned = FALSE
    FixPauseKeepsFinished = FALSE
    AllowFailure = FALSE
    ForegroundReattach = FALSE
    WakeWindsDown = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANT TrainNeverStranded
