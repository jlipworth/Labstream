\* SPEC: DownloadsRangeTrain
\* EXPECT: violation TrainNeverWedged
\* OPEN FINDING R4, the code as it stands with two-byte segments: after a crash in the middle
\* of an append, a segment the daemon finished while the app was dead is adopted beside the
\* segments the planner started, so two bodies are held ahead of the checkpoint. The head
\* segment then fails once. The planner counts the two held bodies against its depth of two
\* and plans nothing, so the gap they wait for is never fetched.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    SegBytes = 2
    NSeg = 3
    Depth = 2
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    IntervalAwarePlan = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = TRUE
    FixSnapshotOwnedWork = FALSE
    FixHeadGapPlanned = FALSE
    FixPauseKeepsFinished = TRUE
    AllowFailure = TRUE
    ForegroundReattach = TRUE
    WakeWindsDown = TRUE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANT TrainNeverWedged
