\* SPEC: DownloadsRangeTrain
\* EXPECT: violation PauseKeepsFinishedSegment
\* OPEN FINDING R3, the code as it stands: a segment finishes in the daemon while a pause is
\* landing. The pause's task listing still holds it, so pauseRangeTask drops its tracking and
\* marks it superseded; its finish callback is then ignored and the finished body is lost.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    SegBytes = 1
    NSeg = 3
    Depth = 2
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    IntervalAwarePlan = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = FALSE
    FixSnapshotOwnedWork = FALSE
    FixHeadGapPlanned = FALSE
    FixPauseKeepsFinished = FALSE
    AllowFailure = FALSE
    ForegroundReattach = FALSE
    WakeWindsDown = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
PROPERTY PauseKeepsFinishedSegment
