\* SPEC: DownloadsRangeTrain
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands: an admitted row eventually reaches a stable
\* state once the environment (user, crashes, foreground) stops.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    NSeg = 3
    Depth = 2
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = FALSE
    AllowFailure = TRUE
    ForegroundReattach = TRUE
    BoundEnvironment = TRUE
    EnvBudget = 4
INVARIANT TypeOK
PROPERTY AdmittedEventuallyStable
