\* SPEC: DownloadsRangeTrain
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands: an admitted row eventually reaches a stable
\* state once the environment (user, crashes, foreground) stops. It assumes what Fairness
\* lists in the module: the session's own steps run, a retried segment eventually finishes, and
\* the manager's foreground self-heal runs (Mutant-NoForegroundRefresh drops the last one).
\* A background wake may end before a continuation refills the train (WakeWindsDown).
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    SegBytes = 1
    NSeg = 3
    Depth = 2
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    IntervalAwarePlan = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = TRUE
    FixSnapshotOwnedWork = FALSE
    FixHeadGapPlanned = FALSE
    FixPauseKeepsFinished = TRUE
    FixProgressKeepsFinished = TRUE
    AllowFailure = TRUE
    ForegroundReattach = TRUE
    WakeWindsDown = TRUE
    BoundEnvironment = TRUE
    EnvBudget = 4
INVARIANT TypeOK
PROPERTY AdmittedEventuallyStable
