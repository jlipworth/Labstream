\* SPEC: DownloadsRangeTrain
\* EXPECT: violation ReconcileKeepsUndeliveredBody
\* OPEN FINDING R2, the part the shipped fix (FixReconcileOwnedWork) leaves: a one-segment file
\* finishes in the daemon while the app is dead, and the relaunch reconcile runs before the
\* finished task's callback is redelivered. The session owns nothing yet, the row has no bytes,
\* and reconcile fails it; the body is dropped when it arrives. No ownership check closes this:
\* the row must stay resumable (or the late body must revive it).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    SegBytes = 1
    NSeg = 1
    Depth = 1
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    IntervalAwarePlan = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = TRUE
    FixSnapshotOwnedWork = FALSE
    FixHeadGapPlanned = FALSE
    FixPauseKeepsFinished = TRUE
    FixProgressKeepsFinished = TRUE
    AllowFailure = FALSE
    ForegroundReattach = TRUE
    WakeWindsDown = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
PROPERTY ReconcileKeepsUndeliveredBody
