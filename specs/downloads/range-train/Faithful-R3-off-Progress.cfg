\* SPEC: DownloadsRangeTrain
\* EXPECT: violation PauseKeepsFinishedSegment
\* Faithfulness: the R3 fix (#474) with its progress half off. A segment finishes in the daemon
\* while a pause is landing. The pause's task listing leaves it tracked (R3), but the task's
