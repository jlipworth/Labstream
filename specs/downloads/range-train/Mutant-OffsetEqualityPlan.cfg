\* SPEC: DownloadsRangeTrain
\* EXPECT: violation PlannerFillsGapsOnly
\* Injected bug: the planner judges coverage by offset equality and plans full-size segments
\* from the checkpoint. After a crash in the middle of an append it plans a segment that
\* overlaps an adopted one, and the adopted body is fetched twice.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    SegBytes = 2
    NSeg = 3
    Depth = 2
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    IntervalAwarePlan = FALSE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = TRUE
    FixSnapshotOwnedWork = FALSE
    FixHeadGapPlanned = FALSE
    FixPauseKeepsFinished = TRUE
    AllowFailure = TRUE
    ForegroundReattach = TRUE
    WakeWindsDown = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
PROPERTY PlannerFillsGapsOnly
