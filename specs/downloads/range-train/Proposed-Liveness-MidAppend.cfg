\* SPEC: DownloadsRangeTrain
\* EXPECT: pass
\* Liveness under FairSpec with the R4 fix and two-byte segments: after crashes in the middle of
\* an append an admitted row still reaches a stable state once the environment stops.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    SegBytes = 2
    NSeg = 2
    Depth = 2
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    IntervalAwarePlan = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = TRUE
    FixSnapshotOwnedWork = FALSE
    FixHeadGapPlanned = TRUE
    FixPauseKeepsFinished = TRUE
    FixProgressKeepsFinished = TRUE
    AllowFailure = TRUE
    ForegroundReattach = TRUE
    WakeWindsDown = TRUE
    BoundEnvironment = TRUE
    EnvBudget = 3
INVARIANT TypeOK
PROPERTY AdmittedEventuallyStable
