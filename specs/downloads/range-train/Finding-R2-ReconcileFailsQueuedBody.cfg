\* SPEC: DownloadsRangeTrain
\* EXPECT: violation ReconcileKeepsQueuedBody
\* OPEN FINDING R2, the code as it stands, a one-segment file: its body is finished, stashed
\* and queued for the append when the app returns to the foreground. Reattach reports no live
\* task, and reconcile fails the row and deletes its working file. The whole body is lost.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    SegBytes = 1
    NSeg = 1
    Depth = 1
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    IntervalAwarePlan = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = FALSE
    FixSnapshotOwnedWork = FALSE
    FixHeadGapPlanned = FALSE
    FixPauseKeepsFinished = FALSE
    AllowFailure = FALSE
    ForegroundReattach = TRUE
    WakeWindsDown = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
PROPERTY ReconcileKeepsQueuedBody
