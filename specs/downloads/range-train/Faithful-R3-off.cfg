\* SPEC: DownloadsRangeTrain
\* EXPECT: violation PauseKeepsFinishedSegment
\* Faithfulness: the code as it stands with the R3 fix off (#474): a segment finishes in the
\* daemon while a pause is landing. The pause's task listing still holds it, so pauseRangeTask
\* drops its tracking and marks it superseded; its finish callback is then ignored and the
\* finished body is lost.
