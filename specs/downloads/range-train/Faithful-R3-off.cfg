    Rows = {r1}
    SegBytes = 1
    NSeg = 3
    Depth = 2
    MaxAttempt = 1
    MaxRestarts = 0
    FixB00 = TRUE
    FixB03 = TRUE
    FixB22 = TRUE
    CheckTrainEpoch = TRUE
    CheckAlignment = TRUE
    IntervalAwarePlan = TRUE
    FixDrainContinues = FALSE
    FixReconcileOwnedWork = TRUE
    FixSnapshotOwnedWork = FALSE
    FixHeadGapPlanned = FALSE
    FixPauseKeepsFinished = FALSE
    FixProgressKeepsFinished = TRUE
    AllowFailure = FALSE
    ForegroundReattach = FALSE
    WakeWindsDown = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
PROPERTY PauseKeepsFinishedSegment
