\* SPEC: DownloadsWake
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands: every stored handler is called or dies with the process, even when an operation leaks and finish-events never come.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Handlers = {h1, h2}
    Ops = {o1}
    MaxTime = 4
    WholeWake = 2
    OpBudget = 1
    Reserve = 1
    MaxCrash = 1
    MaxEvents = 1
    MaxOps = 1
    MaxFails = 1
    MaxRetries = 0
    AllowStuck = TRUE
    FixB04 = TRUE
    FixB05 = TRUE
    FixB06 = TRUE
    FixB11 = TRUE
    FixB13 = TRUE
    FixStaleDeadline = FALSE
    MutantDrainByIdentifier = FALSE
INVARIANT TypeOK
PROPERTY HandlerEventuallyCalled
