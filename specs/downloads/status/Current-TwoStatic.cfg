\* SPEC: DownloadsStatus
\* EXPECT: pass
\* The code as it stands, two static-range rows sharing the batch, one interference. The rows are
\* interchangeable, so the run uses SYMMETRY. Byte counters stop at 1 to keep the run in the default
\* tier; Deep-TwoStatic counts to 2.
SPECIFICATION Spec
SYMMETRY RowSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {}
    SlowRows = {}
    MaxBytes = 1
    EnvBudget = 1
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
INVARIANTS
    TypeOK
    NoPartialSum
    NoUnsharedWindow
    NoInflatedAggregate
    NoInflatedRowRate
    AggregateMatchesBatch
    NoSpuriousReset
    PhaseNoGhostWork
    PhaseNeverIdleWhileTaskRuns
    PhaseBackendHonest
    SidebarHonest
    HealthHonest
    WaitingReadsAsWaiting
    StallRestartsCapped
PROPERTIES
    BytesMonotone
