\* SPEC: DownloadsStatus
\* EXPECT: violation NoRestartOfMovingStream
\* Faithfulness: the #501 conditional commit (review of PR #505) off, the finishing race alone.
\* The constraint keeps only verdicts observed on the last byte, so no callback can raise the bytes
\* after the stall: the stream wedged on its last byte, the body finishes while the verdict waits (`finalizing`, which still shows `downloading`),
\* the read passes it, the manager cancels, and only then does the reducer reject `stallDetected`.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {r1}
    PlannedRows = {}
    StallRows = {r1}
    SlowRows = {}
    MaxBytes = 1
    EnvBudget = 2
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"stall", "unstall"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
    FixStallCommit <- Off
CONSTRAINT
    StallObservedAtLastByte
INVARIANTS
    NoRestartOfMovingStream
