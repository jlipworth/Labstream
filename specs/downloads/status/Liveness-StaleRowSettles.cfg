\* SPEC: DownloadsStatus
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands (S2 fixed, #488), one static-range row that may
\* stall silently through three interferences: its speed is removed and "Updating speed..." resolves.
\* Since the review of PR #505 the speed expires through one armed refresh, and once the row is silent
\* for good the refreshes stop (SilenceStopsRefreshes; fix off: Faithful-488-Polling-off).
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {r1}
    SlowRows = {}
    MaxBytes = 2
    EnvBudget = 3
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    SpeedSettlesAfterStall
    EventuallyStable
    UpdatingResolves
    SilenceStopsRefreshes
