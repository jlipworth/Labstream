\* SPEC: DownloadsStatus
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands, one static-range row with no silent stall: the
\* published speeds settle after pause, sleep and process death.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {}
    SlowRows = {}
    MaxBytes = 2
    EnvBudget = 3
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    SpeedSettlesAfterStall
    EventuallyStable
    UpdatingResolves
