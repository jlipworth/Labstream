\* SPEC: DownloadsStatus
\* EXPECT: pass
\* TIER: deep
\* Current-TwoStatic with byte counters to 2, so a checkpoint can lie strictly between empty and
\* complete while the other row moves.
SPECIFICATION Spec
SYMMETRY RowSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {}
    SlowRows = {}
    MaxBytes = 2
    EnvBudget = 1
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
INVARIANTS
    TypeOK
    NoPartialSum
    NoUnsharedWindow
    NoInflatedAggregate
    NoInflatedRowRate
    AggregateMatchesBatch
    NoSpuriousReset
    PhaseNoGhostWork
    PhaseNeverIdleWhileTaskRuns
    PhaseBackendHonest
    SidebarHonest
    HealthHonest
    WaitingReadsAsWaiting
    StallRestartsCapped
    NoRestartOfMovingStream
PROPERTIES
    BytesMonotone
