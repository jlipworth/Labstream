\* SPEC: DownloadsStatus
\* EXPECT: violation TEMPORAL
\* Finding S2: a static-range row stalls while the top speed is hidden; no refresh is scheduled, so
\* the row keeps showing its last speed although no bytes move. The temporal property violated is
\* SpeedSettlesAfterStall (TLC names none; the script reports TEMPORAL).
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {r1}
    SlowRows = {}
    MaxBytes = 2
    EnvBudget = 1
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = FALSE
    WatchdogCoversTransfers = FALSE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = FALSE
PROPERTIES
    SpeedSettlesAfterStall
