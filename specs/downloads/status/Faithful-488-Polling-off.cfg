\* SPEC: DownloadsStatus
\* EXPECT: violation TEMPORAL
\* Faithfulness: the #488 one-shot rate expiry (review of PR #505) off. The first #488 fix kept the
\* refresh loop alive while any row transferred, so one static-range row that stalls for good keeps
\* a refresh running for ever. The temporal property violated is SilenceStopsRefreshes (TLC names
\* none; the script reports TEMPORAL). Liveness-StaleRowSettles is the same row with the fix on.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {r1}
    SlowRows = {}
    MaxBytes = 2
    EnvBudget = 1
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"stall"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
    FixRateExpiry <- Off
PROPERTIES
    SilenceStopsRefreshes
