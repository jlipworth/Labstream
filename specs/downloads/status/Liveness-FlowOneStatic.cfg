\* SPEC: DownloadsStatus
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands, one static-range transfer that never finishes
\* through three interferences of any kind, a silent stall included: the number returns after every
\* sleep, pause and process death, and stays, and a stalled row's speed is removed.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {r1}
    SlowRows = {}
    MaxBytes = 1
    EnvBudget = 3
    Endless = TRUE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    UpdatingResolves
    EventuallyStable
    SpeedSettlesAfterStall
