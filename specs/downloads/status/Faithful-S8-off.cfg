\* SPEC: DownloadsStatus
\* EXPECT: violation NoRestartOfMovingStream
\* Faithfulness: the S8 fix off. The watchdog finds a forward-only stream stalled and queues a
\* restart; before the queued operation runs, the stream moves again and a callback raises the
\* row's bytes. The operation re-reads the row but not its bytes, cancels the moving stream and
\* restarts it from byte 0.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {r1}
    PlannedRows = {}
    StallRows = {r1}
    SlowRows = {}
    MaxBytes = 2
    EnvBudget = 2
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"stall", "unstall"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = FALSE
INVARIANTS
    NoRestartOfMovingStream
