\* SPEC: DownloadsStatus
\* EXPECT: pass
\* #502 fixed: one static-range row whose open-ended remainder pauses with resume data, resumed by a
\* task that counts from its own baseline or cumulatively, through pause, resume and a nap or a
\* long sleep. The published sample never goes down and never claims bytes the row lacks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {}
    SlowRows = {}
    MaxBytes = 4
    EnvBudget = 4
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "sleep"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
    ResumeBlobRows <- StaticRows
INVARIANTS
    TypeOK
    NoPartialSum
    NoUnsharedWindow
    NoInflatedAggregate
    NoInflatedRowRate
    AggregateMatchesBatch
    NoSpuriousReset
    PhaseNoGhostWork
    PhaseNeverIdleWhileTaskRuns
    PhaseBackendHonest
    SidebarHonest
    HealthHonest
    WaitingReadsAsWaiting
    StallRestartsCapped
    NoRestartOfMovingStream
    ResumedBytesHonest
PROPERTIES
    BytesMonotone
    PublishedSampleMonotone
