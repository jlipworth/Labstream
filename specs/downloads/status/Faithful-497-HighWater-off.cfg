\* SPEC: DownloadsStatus
\* EXPECT: violation StallRestartsCapped
\* Faithfulness: the #497 high-water-mark fix (review of PR #505) off. A forward-only stream reaches
\* its last byte and wedges there. Each automatic restart replays it from byte 0, and the replayed
\* bytes up to where it wedged used to clear the tracker's restart count, so the third stall is
\* restarted again: more than MaxStallRestarts restarts with no byte past the high-water mark.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {r1}
    PlannedRows = {}
    StallRows = {r1}
    SlowRows = {}
    MaxBytes = 1
    EnvBudget = 3
    Endless = TRUE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"stall"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
    FixStallHighWater <- Off
INVARIANTS
    StallRestartsCapped
