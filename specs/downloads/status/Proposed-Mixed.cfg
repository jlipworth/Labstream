\* SPEC: DownloadsStatus
\* EXPECT: pass
\* The proposed S4 fix on, one static-range and one forward-only row, either may stall silently:
\* every safety property holds, NoInflatedRowRate included.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {r2}
    PlannedRows = {}
    StallRows = {r1, r2}
    SlowRows = {}
    MaxBytes = 1
    EnvBudget = 1
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = TRUE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
INVARIANTS
    TypeOK
    NoPartialSum
    NoUnsharedWindow
    NoInflatedAggregate
    NoInflatedRowRate
    AggregateMatchesBatch
    NoSpuriousReset
    PhaseNoGhostWork
    PhaseNeverIdleWhileTaskRuns
    PhaseBackendHonest
    SidebarHonest
    HealthHonest
    WaitingReadsAsWaiting
    StallRestartsCapped
    NoRestartOfMovingStream
PROPERTIES
    BytesMonotone
