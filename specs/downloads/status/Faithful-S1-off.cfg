\* SPEC: DownloadsStatus
\* EXPECT: violation TEMPORAL
\* Faithfulness: the S1 fix (#487) off. One static-range row stalls silently and stays
\* `transferring`; the other keeps flowing, and the top of Downloads says "Updating speed..." for
\* as long as the stall lasts. The temporal property violated is UpdatingResolves (TLC names none;
\* the script reports TEMPORAL). Liveness-SilentMember is the same run with the fix on.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {r1, r2}
    SlowRows = {}
    MaxBytes = 1
    EnvBudget = 1
    Endless = TRUE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"stall", "unstall"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = FALSE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
PROPERTIES
    UpdatingResolves
