\* SPEC: DownloadsStatus
\* EXPECT: violation TEMPORAL
\* Faithfulness: the S5 (#497) and S1 (#487) fixes off, with a second row: the capped forward-only
\* row is a silent member of the batch, so the top of Downloads says "Updating speed..." while the
\* other row flows. Either fix alone clears it (the capped row fails and leaves the batch, or it
\* counts as zero). MaxStallRestarts is 0 here, so one stall is already past the cap and the run
\* stays small; the code's cap is 2. The temporal property violated is UpdatingResolves (TLC names
\* none; the script reports TEMPORAL). Liveness-StallCapFlow is the same run with the fixes on.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {r2}
    PlannedRows = {}
    StallRows = {r2}
    SlowRows = {}
    MaxBytes = 1
    EnvBudget = 1
    Endless = TRUE
    MaxStallRestarts = 0
    LateCatchUp = FALSE
    Env = {"stall", "unstall"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = FALSE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = FALSE
PROPERTIES
    UpdatingResolves
