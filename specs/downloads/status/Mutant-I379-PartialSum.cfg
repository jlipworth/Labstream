\* SPEC: DownloadsStatus
\* EXPECT: violation NoPartialSum
\* Mutant: the #379 rule off (the top speed is the sum of whichever estimates exist). One row's
\* fresh estimate is published as the batch speed while the other is still warming up.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {}
    SlowRows = {}
    MaxBytes = 2
    EnvBudget = 0
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "partialSum"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = FALSE
    WatchdogCoversTransfers = FALSE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = FALSE
INVARIANTS
    NoPartialSum
