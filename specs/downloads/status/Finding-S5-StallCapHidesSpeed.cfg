\* SPEC: DownloadsStatus
\* EXPECT: violation TEMPORAL
\* Finding S5, with a second row: the capped forward-only row is a silent member of the batch, so
\* the top of Downloads says "Updating speed..." while the other row flows. MaxStallRestarts is 0
\* here, so one stall is already past the cap and the run stays small; the code's cap is 2. The
\* temporal property violated is UpdatingResolves (TLC names none; the script reports TEMPORAL).
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {r2}
    PlannedRows = {}
    StallRows = {r2}
    SlowRows = {}
    MaxBytes = 1
    EnvBudget = 1
    Endless = TRUE
    MaxStallRestarts = 0
    LateCatchUp = FALSE
    Env = {"stall", "unstall"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = FALSE
    WatchdogCoversTransfers = FALSE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = FALSE
PROPERTIES
    UpdatingResolves
