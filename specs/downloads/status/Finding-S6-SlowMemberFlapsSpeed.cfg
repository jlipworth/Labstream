\* SPEC: DownloadsStatus
\* EXPECT: violation TEMPORAL
\* Finding S6: one row's callbacks come 3.5 to 6 s apart, inside callbackGap. Its last observation
\* leaves the 4 s window before the next arrives, the batch has no common 0.5 s, and the top of
\* Downloads alternates between a number and "Updating speed..." for ever. The temporal property
\* violated is EventuallyStable (TLC names none; the script reports TEMPORAL).
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {}
    SlowRows = {r1}
    MaxBytes = 1
    EnvBudget = 0
    Endless = TRUE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
PROPERTIES
    EventuallyStable
