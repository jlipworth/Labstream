CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {r2}
    PlannedRows = {}
    StallRows = {r2}
    MaxBytes = 1
    EnvBudget = 1
    Endless = TRUE
    FixI379 = TRUE
    FixI224 = TRUE
    FixI416 = TRUE
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = FALSE
    WatchdogCoversTransfers = FALSE
    ForwardFirstCallbackRebaseline = FALSE
INVARIANTS
    TypeOK
PROPERTIES
    UpdatingResolves
    EventuallyStable
