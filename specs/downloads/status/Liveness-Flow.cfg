\* SPEC: DownloadsStatus
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands, a static-range and a forward-only transfer that
\* never finish, with a pause and a resume: once interference stops, "Updating speed..." gives way
\* to a number while bytes flow, and the number stays. Deep-LivenessFlow adds sleep, process death
\* and a dropped task.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {r2}
    PlannedRows = {}
    StallRows = {}
    SlowRows = {}
    MaxBytes = 1
    EnvBudget = 2
    Endless = TRUE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
    FixStallRecheck = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    UpdatingResolves
    EventuallyStable
