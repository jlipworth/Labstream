\* SPEC: DownloadsStatus
\* EXPECT: pass
\* The code as it stands, one static-range row through every interference: pause, resume, a nap or a
\* long sleep, wake, process death, a dropped task, a silent stall.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {}
    PlannedRows = {}
    StallRows = {r1}
    SlowRows = {}
    MaxBytes = 2
    EnvBudget = 5
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = TRUE
INVARIANTS
    TypeOK
    NoPartialSum
    NoUnsharedWindow
    NoInflatedAggregate
    NoInflatedRowRate
    AggregateMatchesBatch
    NoSpuriousReset
    PhaseNoGhostWork
    PhaseNeverIdleWhileTaskRuns
    PhaseBackendHonest
    SidebarHonest
    HealthHonest
    WaitingReadsAsWaiting
    StallRestartsCapped
PROPERTIES
    BytesMonotone
