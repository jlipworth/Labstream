\* SPEC: DownloadsStatus
\* EXPECT: violation TEMPORAL
\* Faithfulness: the S5 fix (#497) off. A forward-only stream stalls again after its two automatic
\* restarts made no progress. The tracker's cap answers no, nothing else judges the row, and it
\* stays `transferring` with no bytes. The temporal property violated is ForwardStallGetsVerdict
\* (TLC names none; the script reports TEMPORAL). Liveness-StallCap is the same row with the fix on.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {r1}
    PlannedRows = {}
    StallRows = {r1}
    SlowRows = {}
    MaxBytes = 2
    EnvBudget = 3
    Endless = FALSE
    MaxStallRestarts = 2
    LateCatchUp = FALSE
    Env = {"pause", "resume", "stall", "unstall", "sleep", "crash", "dropTask"}
    Mutant = "none"
    FixPu33 = TRUE
    FixB09 = TRUE
    SilentCountsAsZero = TRUE
    WatchdogCoversTransfers = TRUE
    ForwardFirstCallbackRebaseline = FALSE
    StallCapFails = FALSE
    FixStallRecheck = TRUE
PROPERTIES
    ForwardStallGetsVerdict
