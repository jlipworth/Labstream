\* SPEC: DownloadsCleanup
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands, on a volume that never fills: a Delete the
\* user keeps asking for removes the row and its bytes, and its server job is cancelled.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    InitKinds = {"complete", "completeJob", "prep", "failedJob", "finalizing", "legacy"}
    LegacyFiles = {{"working"}, {"stable"}}
    FixB18 = TRUE
    FixB28 = TRUE
    FixB44 = TRUE
    FixC1 = FALSE
    FixB27 = FALSE
    FixB27Fence = FALSE
    FixB30 = FALSE
    ExplicitRecovery = TRUE
    DiskFills = FALSE
    DiskFrees = FALSE
    PromoFails = TRUE
    BoundEnvironment = TRUE
    EnvBudget = 4
INVARIANT TypeOK
PROPERTIES
    DeleteReclaims
    DeletedRowJobCancelled
