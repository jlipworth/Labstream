\* SPEC: DownloadsCleanup
\* EXPECT: pass
\* PROPOSED fixes on, liveness under FairSpec with a volume that fills and is never freed from
\* outside, failing unlinks and directory syncs, and a legacy row with or without a body. The
\* reserve covers four writes (reservation, journal entry, deletion intent, terminal commit)
\* and a Delete tapped again reuses a durable intent: Delete removes the row and its bytes.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    InitKinds = {"complete", "completeJob", "prep", "failedJob", "finalizing", "legacy"}
    LegacyFiles = {{"working"}, {"stable"}, {}}
    FixB18 = TRUE
    FixB28 = TRUE
    FixB44 = TRUE
    FixC1 = TRUE
    FixB27 = TRUE
    FixB27Fence = TRUE
    FixB30 = TRUE
    ReserveUnits = 4
    FixB30Reuse = TRUE
    StableSortsFirst = FALSE
    UnlinkFails = TRUE
    SyncFails = TRUE
    ExplicitRecovery = TRUE
    DiskFills = TRUE
    DiskFrees = FALSE
    PromoFails = TRUE
    BoundEnvironment = TRUE
    EnvBudget = 4
INVARIANT TypeOK
PROPERTIES
    DeleteReclaims
    DeletedRowJobCancelled
