\* SPEC: DownloadsCleanup
\* EXPECT: violation JobKeptWhileNeeded
\* B28 with its fix off: Delete cancels the server job at once, with no journal entry and
\* before the row is durably marked for deletion, so the disk still holds a row that needs it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    InitKinds = {"prep"}
    LegacyFiles = {{}}
    FixB18 = TRUE
    FixB28 = FALSE
    FixB44 = TRUE
    FixC1 = FALSE
    FixB27 = FALSE
    FixB27Fence = FALSE
    FixB30 = FALSE
    ExplicitRecovery = FALSE
    DiskFills = FALSE
    DiskFrees = FALSE
    PromoFails = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANTS
    TypeOK
    NoOrphanFile
    JobAccountable
    JobKeptWhileNeeded
