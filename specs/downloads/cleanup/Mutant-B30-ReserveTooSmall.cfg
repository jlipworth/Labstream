\* SPEC: DownloadsCleanup
\* EXPECT: violation TEMPORAL
\* Injected mutation of the PROPOSED reserve: it covers three writes, and a Delete of a row
\* with a server job needs four (reservation, journal entry, deletion intent, terminal commit)
\* when the volume fills again before the reserve is put back. DeleteReclaims fails.
\* TEMPORAL is the one PROPERTY below: check-tla-specs.sh cannot name a liveness property.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    InitKinds = {"complete", "completeJob", "prep", "failedJob", "finalizing", "legacy"}
    LegacyFiles = {{"working"}, {"stable"}, {}}
    FixB18 = TRUE
    FixB28 = TRUE
    FixB44 = TRUE
    FixC1 = TRUE
    FixB27 = TRUE
    FixB27Fence = TRUE
    FixB30 = TRUE
    ReserveUnits = 3
    FixB30Reuse = TRUE
    StableSortsFirst = FALSE
    UnlinkFails = TRUE
    SyncFails = TRUE
    ExplicitRecovery = TRUE
    DiskFills = TRUE
    DiskFrees = FALSE
    PromoFails = TRUE
    BoundEnvironment = TRUE
    EnvBudget = 4
INVARIANT TypeOK
PROPERTY DeleteReclaims
