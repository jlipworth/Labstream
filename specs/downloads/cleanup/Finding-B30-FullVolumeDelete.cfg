\* SPEC: DownloadsCleanup
\* EXPECT: violation TEMPORAL
\* OPEN FINDING B30 (#393), the code as it stands: on a completely full volume the deletion
\* intent cannot be saved, so nothing is unlinked and no space comes back however often the
\* user taps Delete.
\* TEMPORAL is the one PROPERTY below: check-tla-specs.sh cannot name a liveness property.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    InitKinds = {"complete", "prep"}
    LegacyFiles = {{}}
    FixB18 = TRUE
    FixB28 = TRUE
    FixB44 = TRUE
    FixC1 = FALSE
    FixB27 = FALSE
    FixB27Fence = FALSE
    FixB30 = FALSE
    ReserveUnits = 0
    FixB30Reuse = FALSE
    StableSortsFirst = FALSE
    UnlinkFails = FALSE
    SyncFails = FALSE
    ExplicitRecovery = TRUE
    DiskFills = TRUE
    DiskFrees = FALSE
    PromoFails = FALSE
    BoundEnvironment = TRUE
    EnvBudget = 3
INVARIANT TypeOK
PROPERTY DeleteReclaimsOnFullVolume
