    FixB25 = TRUE
    FixB32 = TRUE
    FixPublicationOwners = TRUE
    FixPosterReregisters = TRUE
    FixResumeAllUnparks = TRUE
    FixFinishUnparks = TRUE
    FixUnparkOnAccept = FALSE
    FixPassReruns = FALSE
    FixHydrateCompleted = TRUE
    FixPausedHydration = TRUE
    FixBifChosenPart = FALSE
    Drift = "none"
    FixRepairByPartID = TRUE
    FixSourceInventory = TRUE
    PayloadWindow = 0
    Mutation = "none"
    AllowCrash = FALSE
    AllowQuit = FALSE
