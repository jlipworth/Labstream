    Ops = {o1, o2}
    MaxTime = 4
    WholeWake = 2
    OpBudget = 1
    Reserve = 1
    MaxCrash = 1
    MaxEvents = 1
    MaxOps = 2
    MaxFails = 1
    MaxRetries = 1
    AllowStuck = TRUE
    FixB04 = FALSE
    FixB05 = TRUE
    FixB06 = TRUE
    FixB11 = TRUE
    FixB13 = TRUE
    FixStaleDeadline = FALSE
    MutantDrainByIdentifier = FALSE
SYMMETRY Sym
INVARIANT GateHoldsForSuccessor
