\* SPEC: DownloadsCapturePublication
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands without the backstop timer: the body is
\* published once the other holder stops taking the lease. The recheck before parking and the
\* lease-release wake are enough.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "finish"
    FixClaimBeforeCapture = TRUE
    FixIdempotentPublication = TRUE
    FixParkedRetry = TRUE
    RecheckBeforePark = TRUE
    Backstop = FALSE
    MaxRecovery = 1
    MaxOther = 2
INVARIANT TypeOK
PROPERTY EventuallyPublished
