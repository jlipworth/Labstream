\* SPEC: DownloadsSessionCore
\* EXPECT: violation FinishedBodySurvivesPause
\* Faithfulness: the F3 fix (#474) with its progress half off, static lane. The last segment
\* finishes in the daemon while a user pause is landing. The pause's task listing leaves the
\* finished task tracked, but its last progress callback runs under the pause halt before its
\* finish callback: the handler drops its tracking and marks it superseded, so the finish is
\* ignored and the finished body is lost.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {}
    MaxAttempt = 1
    Outcomes = {"complete"}
    FixB02 = TRUE
    FixB03 = TRUE
    FixB09 = TRUE
    FixB10 = TRUE
    FixB12 = TRUE
    FixReplay = TRUE
    FixPauseReconcile = TRUE
    DurableCapture = TRUE
    FixPauseKeepsBody = TRUE
    FixProgressKeepsFinished = FALSE
    FixVerdictBeforeRename = FALSE
    ForegroundReattach = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
PROPERTY FinishedBodySurvivesPause
