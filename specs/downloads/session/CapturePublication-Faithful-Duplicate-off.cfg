\* SPEC: DownloadsCapturePublication
\* EXPECT: violation BodyKept
\* Faithfulness: both halves of the duplicate-publication fix off (the review of #472). The
\* delegate moves the body to the capture path and claims it afterwards. A recovery pass in
\* between claims it and queues a publication; the delegate queues a second one. The first moves
\* the body to the working path; the second clears the working path, finds no capture and fails
\* the row. The only copy of the body is gone.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "finish"
    FixClaimBeforeCapture = FALSE
    FixIdempotentPublication = FALSE
    FixParkedRetry = TRUE
    RecheckBeforePark = TRUE
    Backstop = TRUE
    MaxRecovery = 1
    MaxOther = 0
INVARIANT BodyKept
