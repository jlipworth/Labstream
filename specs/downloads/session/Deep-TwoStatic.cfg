\* SPEC: DownloadsSessionCore
\* EXPECT: pass
\* TIER: deep
\* The code as it stands, two static-range rows sharing the process, one attempt each, the
\* `complete` verdict only, with SYMMETRY over the rows. About 7.9 million distinct states and
\* five minutes at TLC_WORKERS=2.
SPECIFICATION Spec
SYMMETRY RowSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {}
    MaxAttempt = 1
    Outcomes = {"complete"}
    FixB02 = TRUE
    FixB03 = TRUE
    FixB09 = TRUE
    FixB10 = TRUE
    FixB12 = TRUE
    FixReplay = TRUE
    FixPauseReconcile = TRUE
    DurableCapture = TRUE
    FixPauseKeepsBody = TRUE
    FixVerdictBeforeRename = FALSE
    ForegroundReattach = TRUE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANTS
    TypeOK
    CompleteHasPublishedBody
    FinalizingHasBody
    QueuedBodyNotSwept
    StaleCallbackInert
    FinishedBodyNotLost
PROPERTIES
    NoStartWhileUserPaused
    ReplayedOutcomeIsNoOp
    WorkingBodyKept
    UserPauseSticky
    FinishedBodySurvivesPause
