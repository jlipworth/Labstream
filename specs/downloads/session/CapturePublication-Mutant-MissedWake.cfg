\* SPEC: DownloadsCapturePublication
\* EXPECT: violation TEMPORAL
\* Mutant: no recheck before parking and no backstop. The lease is released between the wait's
\* last poll and the park; its wake finds nothing parked, and the parked publication is never
\* run (EventuallyPublished; TLC reports a liveness violation as TEMPORAL).
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "finish"
    FixClaimBeforeCapture = TRUE
    FixIdempotentPublication = TRUE
    FixParkedRetry = TRUE
    RecheckBeforePark = FALSE
    Backstop = FALSE
    MaxRecovery = 0
    MaxOther = 1
INVARIANT TypeOK
PROPERTY EventuallyPublished
