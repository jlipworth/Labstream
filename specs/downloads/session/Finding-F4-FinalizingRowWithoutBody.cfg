\* SPEC: DownloadsSessionCore
\* EXPECT: violation FinalizingAlwaysHasBody
\* OPEN FINDING F4, the code as it stands: a failing truncation verdict renames the body off
\* the working path before the verdict is durable. A crash in between leaves a `finalizing` row
\* with no body: the invariant Current-* used to pass (FinalizingHasBody with no exception) is
\* false once that window is modelled.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {r1}
    MaxAttempt = 1
    Outcomes = {"complete", "truncated"}
    FixB02 = TRUE
    FixB03 = TRUE
    FixB09 = TRUE
    FixB10 = TRUE
    FixB12 = TRUE
    FixReplay = TRUE
    FixPauseReconcile = TRUE
    DurableCapture = TRUE
    FixPauseKeepsBody = TRUE
    FixProgressKeepsFinished = TRUE
    FixVerdictBeforeRename = FALSE
    ForegroundReattach = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANT FinalizingAlwaysHasBody
