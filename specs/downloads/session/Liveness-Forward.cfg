\* SPEC: DownloadsSessionCore
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands, one forward-only row: an admitted row
\* eventually reaches a stable state once the environment (user, crashes, foreground) stops.
\* It assumes what the module lists above Fairness: the session's steps run, and the manager's
\* main-actor steps (the error handoff, the stall watchdog) run, which needs a foreground app.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    ForwardRows = {r1}
    MaxAttempt = 2
    Outcomes = {"complete", "truncated"}
    FixB02 = TRUE
    FixB03 = TRUE
    FixB09 = TRUE
    FixB10 = TRUE
    FixB12 = TRUE
    FixReplay = TRUE
    FixPauseReconcile = TRUE
    DurableCapture = TRUE
    FixPauseKeepsBody = TRUE
    FixProgressKeepsFinished = TRUE
    FixVerdictBeforeRename = FALSE
    ForegroundReattach = TRUE
    BoundEnvironment = TRUE
    EnvBudget = 5
INVARIANT TypeOK
PROPERTY AdmittedEventuallyStable
