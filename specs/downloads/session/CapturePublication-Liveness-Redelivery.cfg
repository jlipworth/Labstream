\* SPEC: DownloadsCapturePublication
\* EXPECT: pass
\* Liveness under FairSpec without the backstop timer: the body was captured by a process that
\* died and the daemon redelivers the finish, with one recovery pass at any time. Whichever of
\* the delegate and recovery claims first publishes. (A captured body with no redelivered finish
\* is published by launch recovery, which is an environment step here and not fair.)
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "redelivery"
    FixClaimBeforeCapture = TRUE
    FixIdempotentPublication = TRUE
    FixParkedRetry = TRUE
    RecheckBeforePark = TRUE
    Backstop = FALSE
    MaxRecovery = 1
    MaxOther = 2
INVARIANT TypeOK
PROPERTY EventuallyPublished
