\* SPEC: DownloadsCapturePublication
\* EXPECT: pass
\* The code as it stands: the body was captured by a process that died and the daemon also
\* redelivers the finish. Whichever of the delegate and recovery claims first publishes; the
\* other stands down.
SPECIFICATION Spec
