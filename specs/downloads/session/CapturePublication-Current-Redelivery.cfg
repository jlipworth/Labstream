    FixIdempotentPublication = TRUE
    FixParkedRetry = TRUE
    RecheckBeforePark = TRUE
    Backstop = TRUE
    MaxRecovery = 2
    MaxOther = 2
INVARIANTS
    TypeOK
    BodyKept
    RowNotFailed
    ClaimHasOwner
    OnePublication
