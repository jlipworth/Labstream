\* SPEC: DownloadsCapturePublication
\* EXPECT: pass
\* Liveness under FairSpec with the recheck off and the backstop on: the timer alone recovers a
\* park that missed its wake.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Start = "finish"
    FixClaimBeforeCapture = TRUE
    FixIdempotentPublication = TRUE
    FixParkedRetry = TRUE
    RecheckBeforePark = FALSE
    Backstop = TRUE
    MaxRecovery = 0
    MaxOther = 1
INVARIANT TypeOK
PROPERTY EventuallyPublished
