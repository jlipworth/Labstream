\* SPEC: DownloadsCleanup
\* EXPECT: violation DeletionIntentDurableBeforeUnlink
\* OPEN FINDING Cleanup-C1, the code as it stands: on a full volume the deletion intent cannot
\* be saved; an explicit recovery re-registers it with preparedRevision 0 and the worker
\* unlinks the files while the disk still holds a live row with no deletion intent.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    InitKinds = {"complete"}
    LegacyFiles = {{}}
    FixB18 = TRUE
    FixB28 = TRUE
    FixB44 = TRUE
    FixC1 = FALSE
    FixB27 = FALSE
    FixB27Fence = FALSE
    FixB30 = FALSE
    ExplicitRecovery = TRUE
    DiskFills = TRUE
    DiskFrees = FALSE
    PromoFails = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANTS
    TypeOK
    NoOrphanFile
    JobAccountable
    JobKeptWhileNeeded
    DeletionIntentDurableBeforeUnlink
    DurablePlayableHasBody
