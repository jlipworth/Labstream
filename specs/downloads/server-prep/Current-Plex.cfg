\* SPEC: DownloadsServerPrep
\* EXPECT: pass
\* The code as it stands, one Plex optimize row, with or without a render that already exists.
\* Poller IDs are interchangeable, so the run uses SYMMETRY. The two orphan-job invariants are
\* left out: finding S1 breaks them.
SPECIFICATION Spec
SYMMETRY PollerSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    PlexRows = {r1}
    Pollers = {p1, p2}
    NoPoller = NoPoller
    InitialRender = {FALSE, TRUE}
    FixB28 = TRUE
    FixB35 = TRUE
    FixB37 = TRUE
    FixB47 = TRUE
    MutantHandoffUnchecked = FALSE
    AbandonJournalsCancel = FALSE
    SlotReturns = TRUE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANTS
    TypeOK
    OneCreatePerIdentity
    HandoffAtMostOnce
    ParkedRowHasNoPoller
    DeletedPrepHasCancelIntent
PROPERTIES
    CreateDecisionSeesNoRender
    HandoffOnlyWhenActive
    ClaimedJobNotCancelled
    MissingCreateFailsBeforeDeadline
    WaitingForSlotFailsOnlyForStorage
