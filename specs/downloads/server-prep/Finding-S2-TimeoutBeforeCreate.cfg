\* dispatched and resumed more than a day after it was first started. The start stamp survives
\* the pause, the poll looks at the 24 h render deadline before it decides to create, and the
\* row fails as "Optimize timed out on the server" with no job ever asked for.
SPECIFICATION Spec
SYMMETRY PollerSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    PlexRows = {r1}
    Pollers = {p1, p2}
    NoPoller = NoPoller
    InitialRender = {FALSE, TRUE}
    FixB28 = TRUE
    FixB35 = TRUE
    FixB37 = TRUE
    FixB47 = TRUE
    MutantHandoffUnchecked = FALSE
    AbandonJournalsCancel = FALSE
    FixDeadlineAfterCreate = FALSE
    SlotReturns = TRUE
    BoundEnvironment = FALSE
    EnvBudget = 0
PROPERTY NoTimeoutBeforeCreate
