\* SPEC: DownloadsAdmission
\* EXPECT: pass
\* TIER: deep
\* The code as it stands, three rows, with the simultaneous-downloads setting switched between 3 and 1 while
\* work runs, and pauses whose task cancel lands later. Lowering the setting keeps the occupants,
\* so occupancy can be over the cap; every new grant still respects what is observed.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2, r3}
    ForwardRows = {r1}
    MaxTotal = 3
    CapChoices = {1, 3}
    ReuseRows = {}
    AsyncCancel = TRUE
    MutantStaleCap = FALSE
    MutantPauseErasesIntent = FALSE
    MaxDeferrals = 1
    FixB63 = TRUE
    FixB65 = TRUE
    FixB66 = TRUE
    FixB67 = TRUE
    WakeAfterBackoff = TRUE
    FixRelaunchKeepsUnstarted = TRUE
    ForegroundReconcile = FALSE
    FixReconcileSkipsChanged = TRUE
    BoundEnvironment = TRUE
    EnvBudget = 3
INVARIANTS
    TypeOK
    OccupancyBoundedByHistory
    DaemonTasksBounded
    NoOrphanQueued
    NothingGrantedBeforeRecovery
    QueuePauseHolds
    ExemptOnlyWhilePaused
    UserPauseHolds
PROPERTIES
    GrantRespectsObservedOccupancy
    FirstStartGoesThroughWindow
    PauseKeepsFirstStart
    OutageDefersFirstStart
    RelaunchKeepsUnstartedRow
