\* SPEC: DownloadsAdmission
\* EXPECT: violation PauseKeepsFirstStart
\* Injected mutation: pausing a waiting first start drops its intent, so the row is no longer a
\* first start when it is resumed. (Not what B65 was: the historical pause kept the mark.)
SPECIFICATION Spec
SYMMETRY RowSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {r1, r2}
    MaxTotal = 2
    CapChoices = {}
    ReuseRows = {}
    AsyncCancel = FALSE
    MutantStaleCap = FALSE
    MutantPauseErasesIntent = TRUE
    MaxDeferrals = 1
    FixB63 = TRUE
    FixB65 = TRUE
    FixB66 = TRUE
    FixB67 = TRUE
    WakeAfterBackoff = TRUE
    FixRelaunchKeepsUnstarted = TRUE
    ForegroundReconcile = FALSE
    FixReconcileSkipsChanged = TRUE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANT TypeOK
PROPERTY PauseKeepsFirstStart
