\* SPEC: DownloadsAdmission
\* EXPECT: violation FirstStartGoesThroughWindow
\* B65 fix off, the historical mechanism: a paused first start keeps its pending-admission
\* mark, and Resume is the generic Retry, which starts the row outside the window while the
\* mark still says it is waiting for its first start.
SPECIFICATION Spec
SYMMETRY RowSymmetry
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1, r2}
    ForwardRows = {r1, r2}
    MaxTotal = 2
    CapChoices = {}
    ReuseRows = {}
    AsyncCancel = FALSE
    MutantStaleCap = FALSE
    MutantPauseErasesIntent = FALSE
    MaxDeferrals = 1
    FixB63 = TRUE
    FixB65 = FALSE
    FixB66 = TRUE
    FixB67 = TRUE
    WakeAfterBackoff = TRUE
    FixRelaunchKeepsUnstarted = FALSE
    BoundEnvironment = FALSE
    EnvBudget = 0
INVARIANT TypeOK
PROPERTY FirstStartGoesThroughWindow
