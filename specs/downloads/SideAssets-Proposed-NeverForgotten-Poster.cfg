\* SPEC: DownloadsSideAssets
\* EXPECT: pass
\* Proposed fix for S1 (a poster fetch reopens its cancelled owner): never forgotten holds for
\* the poster with every environment switch on.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Rows = {r1}
    Kinds = {"poster"}
    NChapters = 1
    NSubs = 2
    ServerHas = {"poster"}
    MaxAttempt = 2
    MaxConcurrent = 2
    MaxDispatch = 1
    MaxPending = 2
    PayloadLimit = 2
    FixB25 = TRUE
    FixB32 = TRUE
    FixPublicationOwners = TRUE
    FixPosterReregisters = TRUE
    FixResumeAllUnparks = TRUE
    FixUnparkOnAccept = FALSE
    PayloadWindow = 0
    AllowCrash = TRUE
    AllowPauseAll = TRUE
    AllowCancelKeepingAttempt = TRUE
    AllowRefusedResume = FALSE
    AllowStoragePark = TRUE
    AllowSessionLoss = TRUE
    AllowServerOutage = TRUE
    BoundEnvironment = TRUE
    EnvBudget = 3
INVARIANT TypeOK
PROPERTY NeverForgotten
