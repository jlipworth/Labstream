\* SPEC: DownloadsWake
\* EXPECT: violation OperationHoldBounded
\* Faithfulness: B13 fix off. The operation deadline alone is missing; the registry, reserve and
\* absolute-deadline timers stay. A leaked operation holds the wake past its own budget, until
\* the absolute deadline.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Handlers = {h1, h2}
    Ops = {o1, o2}
    MaxTime = 4
    WholeWake = 2
    OpBudget = 1
    Reserve = 1
    MaxCrash = 1
    MaxEvents = 1
    MaxOps = 2
    MaxFails = 1
    MaxRetries = 1
    AllowStuck = TRUE
    FixB04 = TRUE
    FixB05 = TRUE
    FixB06 = TRUE
    FixB11 = TRUE
    FixB13 = FALSE
    TimerSlack = 1
    MutantNoAbsoluteDeadline = FALSE
    MutantNoRegistryTimer = FALSE
    FixStaleDeadline = FALSE
    MutantDrainByIdentifier = FALSE
SYMMETRY Sym
INVARIANT OperationHoldBounded
