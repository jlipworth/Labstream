\* SPEC: DownloadsWake
\* EXPECT: violation HandlerClaimedWithinBudget
\* Injected mutation: the wake's absolute-deadline timer is missing. The reserve and operation
\* timers still become due, and a handler whose finish-events never come stays unclaimed past
\* its deadline: another timer being due does not excuse it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Handlers = {h1, h2}
    Ops = {o1, o2}
    MaxTime = 4
    WholeWake = 2
    OpBudget = 1
    Reserve = 1
    MaxCrash = 1
    MaxEvents = 1
    MaxOps = 2
    MaxFails = 1
    MaxRetries = 1
    AllowStuck = TRUE
    FixB04 = TRUE
    FixB05 = TRUE
    FixB06 = TRUE
    FixB11 = TRUE
    FixB13 = TRUE
    TimerSlack = 1
    MutantNoAbsoluteDeadline = TRUE
    MutantNoRegistryTimer = FALSE
    FixStaleDeadline = FALSE
    MutantDrainByIdentifier = FALSE
SYMMETRY Sym
INVARIANT HandlerClaimedWithinBudget
