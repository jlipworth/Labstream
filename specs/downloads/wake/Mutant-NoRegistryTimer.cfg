\* SPEC: DownloadsWake
\* EXPECT: violation HandlerClaimedWithinBudget
\* Injected mutation: the registry's own deadline timer is missing. A handler stored before any
\* session registers has no timer at all and stays unclaimed past its deadline.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Handlers = {h1, h2}
    Ops = {o1, o2}
    MaxTime = 4
    WholeWake = 2
    OpBudget = 1
    Reserve = 1
    MaxCrash = 1
    MaxEvents = 1
    MaxOps = 2
    MaxFails = 1
    MaxRetries = 1
    AllowStuck = TRUE
    FixB04 = TRUE
    FixB05 = TRUE
    FixB06 = TRUE
    FixB11 = TRUE
    FixB13 = TRUE
    TimerSlack = 1
    MutantNoAbsoluteDeadline = FALSE
    MutantNoRegistryTimer = TRUE
    FixStaleDeadline = FALSE
    MutantDrainByIdentifier = FALSE
SYMMETRY Sym
INVARIANT HandlerClaimedWithinBudget
