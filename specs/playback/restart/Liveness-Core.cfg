\* SPEC: PlaybackRestart
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands: Close cleans up, an abandoned session gets a
\* stop, every retry task ends (RetryRuns, since #526) and the scrubber hold is released. Two
\* Retry or quality actions over three sessions, no proxies or seeks.
\* CancelDropsAnswer = TRUE, the shipping behaviour: a cancelled reopen can lose its start answer
\* and leave a session nobody stops (Finding-CancelledReopenLosesAnswer owns that). The cleanup
\* properties here excuse only those LostAnswer sessions: CloseCleansUpOutsideRaceAndLost and
\* AbandonedSessionStoppedOutsideLost.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 7
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    RestartBudget = 1
    AbrRungs = 0
    AbrMaxChanges = 2
    AutoRestartBound = 1
    RestartRoom = 3
    UserSeeks = FALSE
    UserPauses = FALSE
    ResumeSeeks = FALSE
    UsesProxy = FALSE
    EnvFails = TRUE
    AutoRecovery = FALSE
    RejectedResultStopped = TRUE
    StopLatchPerSession = TRUE
    StopDetachesFirst = TRUE
    AttachChecksGeneration = TRUE
    SeekClearChecksGeneration = TRUE
    ResumeSeekGuarded = TRUE
    RetryPreservesPause = TRUE
    EscalateOnExhaustedBudget = TRUE
    StartupRetryOneShot = TRUE
    CleanupClearsProxySlot = TRUE
    CloseSendsFinalStop = TRUE
    RetryJoinsPendingStops = TRUE
    CancelDropsAnswer = TRUE
    FixProxyRecheck = FALSE
    FixJoinCancelledTasks = FALSE
    FixSettleSurvivesAttach = FALSE
    FixRestartResetsStopLatch = TRUE
    FixRetryBailClearsTask = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    CloseCleansUpOutsideRaceAndLost
    AbandonedSessionStoppedOutsideLost
    RetryRuns
    SeekHoldReleased
