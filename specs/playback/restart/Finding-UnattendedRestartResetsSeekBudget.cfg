\* SPEC: PlaybackRestart
\* EXPECT: violation BoundedRestarts
\* OPEN FINDING, the code as it stands: an unattended restart (a stall downshift, the
\* startup-deadline retry, an upshift) resets SeekRestartBudget, whose contract is "reset() on
\* explicit user intent". Seek rebuilds then pass burstLimit inside one window. The seek ghost
\* resets on user intent only; AutoRestartBound is set out of reach. Seeks and automatic
\* recovery, one rung, four sessions, no pauses, resume seeks, proxies or failures.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3, s4}
    MaxGeneration = 10
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    RestartBudget = 1
    AbrRungs = 1
    AbrMaxChanges = 2
    AutoRestartBound = 9
    RestartRoom = 3
    UserSeeks = TRUE
    UserPauses = FALSE
    ResumeSeeks = FALSE
    UsesProxy = FALSE
    EnvFails = FALSE
    AutoRecovery = TRUE
    RejectedResultStopped = TRUE
    StopLatchPerSession = TRUE
    StopDetachesFirst = TRUE
    AttachChecksGeneration = TRUE
    SeekClearChecksGeneration = TRUE
    ResumeSeekGuarded = TRUE
    RetryPreservesPause = TRUE
    EscalateOnExhaustedBudget = TRUE
    StartupRetryOneShot = TRUE
    CleanupClearsProxySlot = TRUE
    CloseSendsFinalStop = TRUE
    RetryJoinsPendingStops = TRUE
    CancelDropsAnswer = TRUE
    FixProxyRecheck = FALSE
    FixJoinCancelledTasks = FALSE
    FixSettleSurvivesAttach = FALSE
    FixRestartResetsStopLatch = TRUE
    FixRetryBailClearsTask = FALSE
PROPERTIES
    BoundedRestarts
