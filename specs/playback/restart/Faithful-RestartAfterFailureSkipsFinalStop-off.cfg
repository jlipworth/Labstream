\* SPEC: PlaybackRestart
\* EXPECT: violation NoOrphansOutsideLostAnswer
\* FAITHFULNESS, fixed in #527: FixRestartResetsStopLatch off is the latch before the fix, in the
\* sentTranscodeStop shape. surfaceFailure sets the latch, a quality or track change restarts
\* from the failure without clearing it (only retry() did), and stop() then sends no stop for
\* the new session. Proposed-ControllerLatch is the same shape with the fix on.
\* NoOrphansOutsideLostAnswer, so the lost answer (Finding-CancelledReopenLosesAnswer) cannot be
\* the shorter way to the violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 7
    RecreateCountsAgainstServer = TRUE
