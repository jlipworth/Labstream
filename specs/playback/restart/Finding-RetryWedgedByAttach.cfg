\* SPEC: PlaybackRestart
\* EXPECT: violation TEMPORAL
\* OPEN FINDING, the code as it stands: a quality or track change restarts from a failure,
\* Retry is tapped while the error still shows, and the restart reaches load() before the retry
\* task's join ends. The task returns at its generation check without clearing
\* failureRetryTask, so retry() ignores every later tap. TEMPORAL is the one PROPERTY below.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 6
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    RestartBudget = 1
    AbrRungs = 0
    AutoRestartBound = 1
    UserSeeks = FALSE
    UserPauses = FALSE
    ResumeSeeks = FALSE
    UsesProxy = FALSE
    EnvFails = TRUE
    AutoRecovery = FALSE
    RejectedResultStopped = TRUE
    StopLatchPerSession = TRUE
    StopDetachesFirst = TRUE
    AttachChecksGeneration = TRUE
    SeekClearChecksGeneration = TRUE
    ResumeSeekGuarded = TRUE
    RetryPreservesPause = TRUE
    EscalateOnExhaustedBudget = TRUE
    StartupRetryOneShot = TRUE
    CleanupClearsProxySlot = TRUE
    CloseSendsFinalStop = TRUE
    RetryJoinsPendingStops = TRUE
    FixProxyRecheck = FALSE
    FixJoinCancelledTasks = FALSE
    FixSettleSurvivesAttach = FALSE
    FixRestartResetsStopLatch = FALSE
    FixRetryBailClearsTask = FALSE
INVARIANTS
    TypeOK
PROPERTIES
    RetryRuns
