\* SPEC: PlaybackRestart
\* EXPECT: violation DetachBeforeStop
\* The order before #327: stop() sends the server stops and releases the item afterwards, so a
\* stopped session still has an attached item requesting from it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 6
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    RestartBudget = 1
    AbrRungs = 0
    AutoRestartBound = 1
    UserSeeks = TRUE
    UserPauses = TRUE
    ResumeSeeks = TRUE
    UsesProxy = TRUE
    EnvFails = TRUE
    AutoRecovery = FALSE
    RejectedResultStopped = TRUE
    StopLatchPerSession = TRUE
    StopDetachesFirst = FALSE
    AttachChecksGeneration = TRUE
    SeekClearChecksGeneration = TRUE
    ResumeSeekGuarded = TRUE
    RetryPreservesPause = TRUE
    EscalateOnExhaustedBudget = TRUE
    StartupRetryOneShot = TRUE
    CleanupClearsProxySlot = TRUE
    CloseSendsFinalStop = TRUE
    RetryJoinsPendingStops = TRUE
    FixProxyRecheck = FALSE
    FixJoinCancelledTasks = FALSE
    FixSettleSurvivesAttach = FALSE
    FixRestartResetsStopLatch = FALSE
    FixRetryBailClearsTask = FALSE
INVARIANTS
    TypeOK
    DetachBeforeStop
