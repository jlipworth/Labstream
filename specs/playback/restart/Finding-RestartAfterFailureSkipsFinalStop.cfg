\* SPEC: PlaybackRestart
\* EXPECT: violation NoOrphans
\* OPEN FINDING, the code as it stands: the sentTranscodeStop shape. surfaceFailure sets the
\* latch, a quality or track change restarts from the failure without clearing it (only retry()
\* does), and stop() then sends no stop for the new session.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 6
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    RestartBudget = 1
    AbrRungs = 0
    AutoRestartBound = 1
    UserSeeks = TRUE
    UserPauses = TRUE
    ResumeSeeks = TRUE
    UsesProxy = TRUE
    EnvFails = TRUE
    AutoRecovery = FALSE
    RejectedResultStopped = TRUE
    StopLatchPerSession = FALSE
    StopDetachesFirst = TRUE
    AttachChecksGeneration = TRUE
    SeekClearChecksGeneration = TRUE
    ResumeSeekGuarded = TRUE
    RetryPreservesPause = TRUE
    EscalateOnExhaustedBudget = TRUE
    StartupRetryOneShot = TRUE
    CleanupClearsProxySlot = TRUE
    CloseSendsFinalStop = TRUE
    RetryJoinsPendingStops = TRUE
    FixProxyRecheck = FALSE
    FixJoinCancelledTasks = FALSE
    FixSettleSurvivesAttach = FALSE
    FixRestartResetsStopLatch = FALSE
    FixRetryBailClearsTask = FALSE
INVARIANTS
    TypeOK
    NoOrphans
