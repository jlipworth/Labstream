\* SPEC: PlaybackRestart
\* EXPECT: pass
\* The code as it stands, MediaBrowser cleanup shape: one controller, three sessions, two user
\* actions, failures, proxies, no automatic recovery. Every property the code keeps.
\* NoOrphansOutsideLostAnswer: NoOrphans for every session but one a cancelled task lost the
\* answer for (Finding-CancelledReopenLosesAnswer). CloseStaysEnabled: the bound never forbids Close.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 7
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    RestartBudget = 1
    AbrRungs = 0
    AbrMaxChanges = 2
    AutoRestartBound = 1
    RestartRoom = 3
    UserSeeks = TRUE
    UserPauses = TRUE
    ResumeSeeks = TRUE
    UsesProxy = TRUE
    EnvFails = TRUE
    AutoRecovery = FALSE
    RejectedResultStopped = TRUE
    StopLatchPerSession = TRUE
    StopDetachesFirst = TRUE
    AttachChecksGeneration = TRUE
    SeekClearChecksGeneration = TRUE
    ResumeSeekGuarded = TRUE
    RetryPreservesPause = TRUE
    EscalateOnExhaustedBudget = TRUE
    StartupRetryOneShot = TRUE
    CleanupClearsProxySlot = TRUE
    CloseSendsFinalStop = TRUE
    RetryJoinsPendingStops = TRUE
    CancelDropsAnswer = TRUE
    FixProxyRecheck = FALSE
    FixJoinCancelledTasks = FALSE
    FixSettleSurvivesAttach = FALSE
    FixRestartResetsStopLatch = TRUE
    FixRetryBailClearsTask = TRUE
INVARIANTS
    TypeOK
    GenerationFencing
    SeekHoldFencing
    PauseIntent
    DetachBeforeStop
    ProxyOwnershipOutsideYieldRace
    NoOrphansOutsideLostAnswer
    CloseStaysEnabled
PROPERTIES
    BoundedRestarts
