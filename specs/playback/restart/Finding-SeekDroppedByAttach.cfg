\* SPEC: PlaybackRestart
\* EXPECT: violation SeekIntentSurvivesAttach
\* OPEN FINDING, the code as it stands: a seek made while a restart is in flight arms the
\* settle timer under the restart's generation; load() bumps the generation, the timer returns
\* at its check and the seek is dropped with the scrubber still held.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 7
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    RestartBudget = 1
    AbrRungs = 0
    AbrMaxChanges = 2
    AutoRestartBound = 1
    RestartRoom = 3
    UserSeeks = TRUE
    UserPauses = TRUE
    ResumeSeeks = TRUE
    UsesProxy = TRUE
    EnvFails = TRUE
    AutoRecovery = FALSE
    RejectedResultStopped = TRUE
    StopLatchPerSession = TRUE
    StopDetachesFirst = TRUE
    AttachChecksGeneration = TRUE
    SeekClearChecksGeneration = TRUE
    ResumeSeekGuarded = TRUE
    RetryPreservesPause = TRUE
    EscalateOnExhaustedBudget = TRUE
    StartupRetryOneShot = TRUE
    CleanupClearsProxySlot = TRUE
    CloseSendsFinalStop = TRUE
    RetryJoinsPendingStops = TRUE
    CancelDropsAnswer = TRUE
    FixProxyRecheck = FALSE
    FixJoinCancelledTasks = FALSE
    FixSettleSurvivesAttach = FALSE
    FixRestartResetsStopLatch = TRUE
    FixRetryBailClearsTask = TRUE
INVARIANTS
    TypeOK
    SeekIntentSurvivesAttach
