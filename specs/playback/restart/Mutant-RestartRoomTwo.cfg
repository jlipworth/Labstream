\* SPEC: PlaybackRestart
\* EXPECT: violation CloseStaysEnabled
\* Injected bound bug (round 1's bound): a restart reserves only its own generation and its
\* load(). The last attach the bound allows, or a failure after it, leaves an open controller
\* that cannot Close, so every check is blind to Close there. Current-Core's constants.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 7
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    RestartBudget = 1
    AbrRungs = 0
    AbrMaxChanges = 2
    AutoRestartBound = 1
    RestartRoom = 2
    UserSeeks = TRUE
    UserPauses = TRUE
    ResumeSeeks = TRUE
    UsesProxy = TRUE
    EnvFails = TRUE
    AutoRecovery = FALSE
    RejectedResultStopped = TRUE
    StopLatchPerSession = TRUE
    StopDetachesFirst = TRUE
    AttachChecksGeneration = TRUE
    SeekClearChecksGeneration = TRUE
    ResumeSeekGuarded = TRUE
    RetryPreservesPause = TRUE
    EscalateOnExhaustedBudget = TRUE
    StartupRetryOneShot = TRUE
    CleanupClearsProxySlot = TRUE
    CloseSendsFinalStop = TRUE
    RetryJoinsPendingStops = TRUE
    CancelDropsAnswer = TRUE
    FixProxyRecheck = FALSE
    FixJoinCancelledTasks = FALSE
    FixSettleSurvivesAttach = FALSE
    FixRestartResetsStopLatch = FALSE
    FixRetryBailClearsTask = FALSE
INVARIANTS
    CloseStaysEnabled
