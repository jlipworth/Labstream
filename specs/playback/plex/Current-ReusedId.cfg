\* SPEC: PlaybackPlex
\* EXPECT: pass
\* Review focus 2: old and new jobs share the session id. A stop may end unacknowledged, so a
\* job whose stop was lost runs on under the id beside its replacement. Passes on the assumption
\* that a PMS stop ends every job under the id (StopEndsAllUnderId = TRUE);
\* Finding-StopEndsOnlySome is the same run without it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 16
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    NoWrongKill
    StopNeverKillsSuccessor
    NoZombieItem
    NoOrphans
    CleanAfterAckedClose
