\* SPEC: PlaybackPlex
\* EXPECT: violation LiveStopNeverKillsSuccessor
\* Injected bug: retry() does not join pendingStopTasks, so the failed attempt's detached stop is
\* still unanswered when Retry restarts under the same id, and it ends the replacement.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 16
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = FALSE
    StopsCanBeLate = FALSE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = FALSE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = TRUE
INVARIANTS
    LiveStopNeverKillsSuccessor
