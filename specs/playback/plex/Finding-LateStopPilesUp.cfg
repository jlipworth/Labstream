\* SPEC: PlaybackPlex
\* EXPECT: violation OneEncoder
\* Suspect 2, the other half: the wait gave up, the old job was not stopped, and the replacement
\* starts beside it. Holds whether or not a cancelled stop can still be applied.
SPECIFICATION Spec
