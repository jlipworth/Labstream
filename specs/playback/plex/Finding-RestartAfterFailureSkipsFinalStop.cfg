\* SPEC: PlaybackPlex
\* EXPECT: violation NoOrphans
\* The restart core's finding under the Plex order: sentTranscodeStop stays set through a restart
\* from a failure, so Close sends no stop for the job that restart started.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 16
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = TRUE
    WarmRetries = TRUE
    StopsCanFail = FALSE
    StopsCanBeLate = FALSE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = FALSE
INVARIANTS
    NoOrphans
