\* SPEC: PlaybackPlex
\* EXPECT: violation LiveStopNeverKillsSuccessor
\* Faithfulness check for the #530 fix (was Finding-FinalStopKillsReplacement). With
\* FailureRestartJoinsPendingStops off, a quality or track change while a failure shows restarts
\* without joining pendingStopTasks (only retry() did), so surfaceFailure's detached stop can be
\* applied after the replacement starts. No timeout and no cancelled request is involved.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 16
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = TRUE
    WarmRetries = TRUE
    StopsCanFail = FALSE
    StopsCanBeLate = FALSE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = FALSE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = TRUE
INVARIANTS
    LiveStopNeverKillsSuccessor
