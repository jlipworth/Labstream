\* SPEC: PlaybackPlex
\* EXPECT: violation LiveStopNeverKillsSuccessor
\* Conditional on PMS applying a stop whose request the client stopped waiting for
\* (CancelledStopCanLand; #536). Current-LateFail with the #539 check on. The failure's detached
\* stop passes its bound unanswered, the Retry tap re-sends it and PMS answers the re-send, Retry
\* restarts under the same session id, and the first stop, still on the wire, is applied and ends
\* the replacement: an answered second stop does not fence an abandoned first one.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 11
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = TRUE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    FailureRestartJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = FALSE
INVARIANTS
    TypeOK
    OneEncoderOutsideCancelledStops
    LiveStopNeverKillsSuccessor
    NoZombieItem
    NoOrphans
    CleanAfterAckedClose
