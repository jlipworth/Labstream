\* SPEC: PlaybackPlex
\* EXPECT: violation CleanAfterAckedClose
\* Suspect 4 on Plex: Close cancels a task whose start request the server has already read. The
\* final stop is acknowledged, having found nothing to end, and the start is acted on after it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 16
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = FALSE
    StopsCanBeLate = FALSE
    LateStarts = TRUE
    ConsentPossible = FALSE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    FailureRestartJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = FALSE
INVARIANTS
    CleanAfterAckedClose
