\* SPEC: PlaybackPlex
\* EXPECT: pass
\* The proposed fixes under FairSpec. The unbounded wait they add needs every stop to be answered
\* or to fail, which URLSession's request timeout provides.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 11
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = TRUE
    WarmRetries = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = TRUE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = TRUE
    FixRestartResetsStopLatch = TRUE
PROPERTIES
    RestartSettles
    CloseCleansUp
