\* SPEC: PlaybackPlex
\* EXPECT: violation ConsentBoundary
\* Current-Consent with stops that can go unanswered for two seconds. No server assumption. The
\* copy lane fails, the rebuild's stop and requestVideoTranscodeConsent's own stop each give up
\* after two seconds, their results discarded, and the choice shows while the copy job still runs.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 19
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = FALSE
    StopsCanBeLate = TRUE
    LateStarts = FALSE
    ConsentPossible = TRUE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    FailureRestartJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = TRUE
INVARIANTS
    TypeOK
    ConsentBoundary
