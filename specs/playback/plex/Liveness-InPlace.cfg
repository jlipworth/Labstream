\* SPEC: PlaybackPlex
\* EXPECT: pass
\* Liveness under FairSpec, the code as it stands: every stop is answered or fails. A start or
\* restart ends, and after Close every task returns and the joined cleanup ends.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 11
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = TRUE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = TRUE
PROPERTIES
    RestartSettles
    CloseCleansUp
