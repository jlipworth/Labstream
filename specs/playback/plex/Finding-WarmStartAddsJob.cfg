\* SPEC: PlaybackPlex
\* EXPECT: violation OneEncoder
\* Conditional on PMS behaviour: the code as it stands against a server where the
\* startup-deadline retry's request starts a second job instead of being served by the one
\* already running (WarmStartJoinsJob = FALSE). Whether PMS serves it from the running job, as
\* that retry assumes, is not established; if it does, this is no defect.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 16
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = FALSE
    StopsCanBeLate = FALSE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = FALSE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    FailureRestartJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = FALSE
INVARIANTS
    OneEncoder
