\* SPEC: PlaybackPlex
\* EXPECT: pass
\* The in-place restart as it stands, where every stop is acknowledged within the two-second
\* wait, a cancelled request reaches nobody and requests are served in the order sent. One
\* controller, three quality or Retry actions, failures and the startup-deadline retry. No two
\* jobs ever run under the id, so StopEndsAllUnderId is not relied on (FALSE).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 21
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 3
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = FALSE
    StopsCanBeLate = FALSE
    LateStarts = FALSE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    NoWrongKill
    StopNeverKillsSuccessor
    NoZombieItem
    NoOrphans
    CleanAfterAckedClose
