\* SPEC: PlaybackPlex
\* EXPECT: violation CleanAfterAckedClose
\* Conditional on PMS behaviour: the code as it stands against a server whose stop may end only
\* some of the jobs under the id (StopEndsAllUnderId = FALSE, the setting that assumes nothing),
\* with Current-ReusedId's run. A job whose stop was lost outlives an acknowledged final stop.
\* Whether PMS ends every job under the id is not established; if it does, this is no defect.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 16
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = FALSE
INVARIANTS
    CleanAfterAckedClose
