\* SPEC: PlaybackPlex
\* EXPECT: violation LiveStopNeverKillsSuccessor
\* Conditional on PMS (CancelledStopCanLand: PMS may apply a stop whose connection the client
\* dropped). Current-LateAck with failures, RetryNeedsConfirmedStop off (#539). A failure's
\* detached stop passes its timeout unanswered, retry()'s join returns, and without the check the
\* Retry's own stop is acknowledged and the replacement starts, and the timed-out stop, still on
\* the wire, is applied and ends it. The client cancelled nothing itself, so the weaker property
\* fails too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 16
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = TRUE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = FALSE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = FALSE
INVARIANTS
    TypeOK
    OneEncoderOutsideCancelledStops
    LiveStopNeverKillsSuccessor
    NoZombieItem
    NoOrphans
    CleanAfterAckedClose
