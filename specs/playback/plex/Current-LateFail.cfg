\* SPEC: PlaybackPlex
\* EXPECT: pass
\* Current-LateAck with failures (EnvFails = TRUE): late and cancelled stops can land while Retry
\* runs. One user action and MaxGeneration = 11 keep it small. Every Current-LateAck invariant,
\* LiveStopNeverKillsSuccessor included: a failure's detached stop that timed out makes Retry fail
\* with priorSessionStopUnconfirmed instead of restarting under the session (#539;
\* Faithful-RetryAfterTimedOutStop-off is the run without that check).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 11
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = TRUE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = FALSE
INVARIANTS
    TypeOK
    OneEncoderOutsideCancelledStops
    LiveStopNeverKillsSuccessor
    NoZombieItem
    NoOrphans
    CleanAfterAckedClose
