\* SPEC: PlaybackPlex
\* EXPECT: pass
\* TIER: deep
\* Two controllers sharing the server, each under its own session id (IdsNeverShared: the id is a
\* UUID minted per controller), so a closing playback overlaps the next one. Current-ReusedId's
\* run with one user action each.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1, c2}
    SessionIds = {s1, s2}
    MaxGeneration = 11
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = FALSE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    FailureRestartJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = TRUE
INVARIANTS
    TypeOK
    OneEncoder
    NoWrongKill
    StopNeverKillsSuccessor
    NoZombieItem
    NoOrphans
    CleanAfterAckedClose
