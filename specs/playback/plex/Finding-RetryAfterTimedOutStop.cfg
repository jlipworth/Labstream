\* SPEC: PlaybackPlex
\* EXPECT: violation LiveStopNeverKillsSuccessor
\* Conditional on PMS (CancelledStopCanLand: PMS may apply a stop whose connection the client
\* dropped). Current-LateAck with failures. A failure's detached stop passes its URLSession request
\* timeout (5 s on the recovery client) unanswered, retry()'s join returns, the Retry's own stop
\* is acknowledged and the replacement starts, and the timed-out stop, still on the wire, is
\* applied and ends it. The client cancelled nothing itself, so the weaker property fails too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 16
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    WarmRetries = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    LateStarts = FALSE
    ConsentPossible = FALSE
    CancelledStopCanLand = TRUE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = TRUE
INVARIANTS
    TypeOK
    OneEncoderOutsideCancelledStops
    LiveStopNeverKillsSuccessor
    NoZombieItem
    NoOrphans
    CleanAfterAckedClose
