\* SPEC: PlaybackPlex
\* EXPECT: violation StopNeverKillsSuccessor
\* Conditional on PMS (CancelledStopCanLand). Current-Consent with stops that can go unanswered
\* for two seconds, one user action, no failures and no startup-deadline retry, and the user's one
\* action is Approve, whose own stop is answered within its wait (CONSTRAINT ConsentRoute), so
\* that the trace is the consent route and not Finding-LateStopKillsReplacement's give-up in the
\* restart Approve makes. A consent request's stop gives up, the user approves, the Approve
\* restart's own stop is acknowledged and the encode starts, and the stop the consent request gave
\* up on is applied and ends it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1}
    MaxGeneration = 19
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 1
    EnvFails = FALSE
    RestartFromFailure = FALSE
    WarmRetries = FALSE
    StopsCanFail = FALSE
    StopsCanBeLate = TRUE
    LateStarts = FALSE
    ConsentPossible = TRUE
    CancelledStopCanLand = TRUE
    WarmStartJoinsJob = TRUE
    StopsPreviousFirst = TRUE
    WaitsForPreviousStop = TRUE
    BoundedStopWait = TRUE
    DetachesBeforeStart = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = TRUE
    CloseSendsFinalStop = TRUE
    FixStartAfterOwnStops = FALSE
    FixRestartResetsStopLatch = TRUE
INVARIANTS
    TypeOK
    StopNeverKillsSuccessor
CONSTRAINT
    ConsentRoute
