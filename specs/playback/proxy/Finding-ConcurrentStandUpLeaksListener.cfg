\* standUpLoopback calls on one proxy. The second sees current == nil during the first's await,
\* stops nothing, and its build overwrites self.listener: the first listener leaks.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1, c2}
    MaxOpens = 2
    MaxConns = 1
    RotateBudget = 1
    AllowReopen = FALSE
    EnvFails = TRUE
    StopChecksGeneration = TRUE
    ReopenStopsPrior = TRUE
    RotateFenced = TRUE
    RotateCAS = TRUE
    CallerCancels = TRUE
    CallerRechecks = TRUE
    FixCancelHandlers = FALSE
    FixInvalidateOnStop = FALSE
INVARIANTS
    TypeOK
    SingleReachableListener
