\* SPEC: PlaybackProxy
\* EXPECT: violation NoAcceptAfterStop
\* stop(generation:) returns with the listener cancel only queued; a connection the listener
\* accepts before that block runs is served for a session that is gone.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    MaxOpens = 1
    MaxConns = 3
    RotateBudget = 2
    AllowReopen = FALSE
    EnvFails = TRUE
    StopChecksGeneration = TRUE
    ReopenStopsPrior = TRUE
    RotateFenced = TRUE
    RotateCAS = TRUE
    CallerCancels = TRUE
    CallerRechecks = TRUE
    FixCancelHandlers = FALSE
    FixInvalidateOnStop = FALSE
INVARIANTS
    TypeOK
    NoAcceptAfterStop
