\* SPEC: PlaybackProxy
\* EXPECT: pass
\* Proposed fix: stop synchronously cancels the session's tracked handler Tasks and refuses
\* new connections, handlers check cancellation before every upstream attempt, and stop
\* invalidates the upstream session (a re-open makes a fresh one). Every safety property at
\* Current-Reopen's bounds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    MaxOpens = 2
    MaxConns = 3
    RotateBudget = 1
    AllowReopen = TRUE
    EnvFails = TRUE
    StopChecksGeneration = TRUE
    ReopenStopsPrior = TRUE
    RotateFenced = TRUE
    RotateCAS = TRUE
    CallerCancels = TRUE
    CallerRechecks = TRUE
    FixCancelHandlers = TRUE
    FixInvalidateOnStop = TRUE
INVARIANTS
    TypeOK
    TeardownNotLost
    SingleReachableListener
    CancelHitsOwnListener
    StaleStopIgnored
    RotateRetiresFailedGeneration
    NoFetchAfterStop
    NoAcceptAfterStop
    UpstreamSessionReleased
