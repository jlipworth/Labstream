    CallerRechecks = TRUE
    FixCancelHandlers = FALSE
    FixInvalidateOnStop = FALSE
INVARIANTS
    TypeOK
    TeardownNotLost
    SingleReachableListener
    CancelHitsOwnListener
    StaleStopIgnored
    RotateRetiresFailedGeneration
