\* SPEC: PlaybackProxy
\* EXPECT: violation UpstreamSessionReleased
\* No path invalidates SessionBox's current URLSession: after stop it stays valid for the
\* life of the process (only rotated-out sessions are invalidated).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    MaxOpens = 1
    MaxConns = 3
    RotateBudget = 2
    AllowReopen = FALSE
    EnvFails = TRUE
    StopChecksGeneration = TRUE
    ReopenStopsPrior = TRUE
    RotateFenced = TRUE
    RotateCAS = TRUE
    CallerCancels = TRUE
    CallerRechecks = TRUE
    FixCancelHandlers = FALSE
    FixInvalidateOnStop = FALSE
INVARIANTS
    TypeOK
    UpstreamSessionReleased
