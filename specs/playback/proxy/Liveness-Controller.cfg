\* SPEC: PlaybackProxy
\* EXPECT: pass
\* Fairness run of Current-Controller: handlers finish, torn-down listeners die, teardowns complete.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    MaxOpens = 1
    MaxConns = 3
    RotateBudget = 2
    AllowReopen = FALSE
    EnvFails = TRUE
    StopChecksGeneration = TRUE
    ReopenStopsPrior = TRUE
    RotateFenced = TRUE
    RotateCAS = TRUE
    CallerCancels = TRUE
    CallerRechecks = TRUE
    FixCancelHandlers = FALSE
    FixInvalidateOnStop = FALSE
INVARIANTS
    TypeOK
PROPERTIES
    HandlersFinish
    StoppedListenerDies
    TeardownCompletes
