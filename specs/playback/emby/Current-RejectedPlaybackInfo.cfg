\* SPEC: PlaybackEmby
\* EXPECT: pass
\* Local validation rejects an encoder-backed result. One replacement and one Retry,
\* with distinct session IDs and no external encoder recreation. Stops can fail or
\* time out before a late ack. Only an on-time ack releases barrier authority.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    ServerRecreates = FALSE
    IdReuse = "never"
    AbandonedNegotiateCanLand = FALSE
    StopsBeforeNegotiate = TRUE
    WaitsForStopAck = TRUE
    BlocksOnUnconfirmedStop = TRUE
    JoinsPredecessor = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRequiresAck = TRUE
    ConsentRejectsNegotiated = TRUE
    DetachesBeforeStop = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    FixCloseJoinsTask = FALSE
INVARIANTS
    TypeOK
    TimedOutTicketNeverSucceeds
    OneEncoder
    NoEncoderWhileUnconfirmed
    BarrierPreconditions
    NoAuthorityAtPrepare
    DetachedWhileStopping
    ConsentBoundary
    NoOrphans
    GenerationsSuffice
