\* SPEC: PlaybackEmby
\* EXPECT: pass
\* Conditional on the server (StopEndsAllUnderId). Current-Reopen with a server that may return
\* any play-session id, one with a job still running under it included (IdReuse = "live"), and
\* whose stop ends every job under the id it names (StopEndsAllUnderId; the 2026-09-17 audit read
\* this in Jellyfin's TranscodeManager, which Emby's closed server is not established to share).
\* Two user actions, three ids, MaxGeneration = 12. Without StopEndsAllUnderId a job the server
\* made again under a returned id takes the acknowledged stop meant for the replacement, and
\* OneEncoder fails (see the README).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    ServerRecreates = TRUE
    IdReuse = "live"
    AbandonedNegotiateCanLand = FALSE
    StopsBeforeNegotiate = TRUE
    WaitsForStopAck = TRUE
    BlocksOnUnconfirmedStop = TRUE
    JoinsPredecessor = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRequiresAck = TRUE
    ConsentRejectsNegotiated = TRUE
    DetachesBeforeStop = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    FixCloseJoinsTask = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    NoEncoderWhileUnconfirmed
    StopNeverKillsSuccessor
    BarrierPreconditions
    NoAuthorityAtPrepare
    DetachedWhileStopping
    ConsentBoundary
    NoOrphans
    GenerationsSuffice
