\* SPEC: PlaybackEmby
\* EXPECT: pass
\* TIER: deep
\* Two controllers sharing the server, so a closing playback overlaps the next one. IdsNeverShared
\* = FALSE: nothing confines a play-session id to one controller (the server mints it, and the
\* stop names the device and the id, with one device for both), and with IdReuse = "stopped" the
\* second playback can be given an id the first one's stopped session had. One user action each,
\* failures, no consent (with consent and #421's remade jobs the run outgrows the deep tier), and
\* jobs the server makes again (#421). Passes given every stop is
\* answered (StopsCanFail = FALSE) and a stop ends every job under its id (StopEndsAllUnderId:
\* with a job made again under a reused id, an acknowledged stop that ends only that job leaves the
\* one it meant, and OneEncoder fails); Finding-BackToBackStaleStop is the run with failing stops.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1, c2}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = FALSE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = FALSE
    StopsCanBeLate = FALSE
    ServerRecreates = TRUE
    IdReuse = "stopped"
    AbandonedNegotiateCanLand = FALSE
    StopsBeforeNegotiate = TRUE
    WaitsForStopAck = TRUE
    BlocksOnUnconfirmedStop = TRUE
    JoinsPredecessor = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRequiresAck = TRUE
    ConsentRejectsNegotiated = TRUE
    DetachesBeforeStop = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    FixCloseJoinsTask = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    NoEncoderWhileUnconfirmed
    StopNeverKillsSuccessor
    BarrierPreconditions
    NoAuthorityAtPrepare
    DetachedWhileStopping
    ConsentBoundary
    NoOrphans
    GenerationsSuffice
