\* SPEC: PlaybackEmby
\* EXPECT: violation StopNeverKillsSuccessor
\* Conditional on Emby behaviour: Current-LateAck against a server that may return a play-session
\* id again once no job runs under it (IdReuse = "stopped"). A stop that timed out is retried and
\* acknowledged, the replacement is negotiated under the same id, and the first request is applied
\* to it. Whether Emby ever returns a used id is not established; if it does not, this is no
\* defect.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    ServerRecreates = TRUE
    IdReuse = "stopped"
    AbandonedNegotiateCanLand = FALSE
    StopsBeforeNegotiate = TRUE
    WaitsForStopAck = TRUE
    BlocksOnUnconfirmedStop = TRUE
    JoinsPredecessor = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRequiresAck = TRUE
    ConsentRejectsNegotiated = TRUE
    DetachesBeforeStop = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    FixCloseJoinsTask = FALSE
INVARIANTS
    StopNeverKillsSuccessor
