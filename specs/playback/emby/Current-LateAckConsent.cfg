\* SPEC: PlaybackEmby
\* EXPECT: pass
\* Late stops with consent: Liveness-BoundedWait's run under Spec, checking every Current
\* invariant. A stop times out and may be applied afterwards while the consent choice can show.
\* One user action, MaxGeneration = 12. Passes given the server never returns a play-session id
\* it has used (IdReuse = "never"). StopNeverKillsSuccessor cannot fail without reuse and is not
\* listed; with reuse a late stop fails it (Finding-LateStopKillsReusedId).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    ServerRecreates = TRUE
    IdReuse = "never"
    AbandonedNegotiateCanLand = FALSE
    StopsBeforeNegotiate = TRUE
    WaitsForStopAck = TRUE
    BlocksOnUnconfirmedStop = TRUE
    JoinsPredecessor = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRequiresAck = TRUE
    ConsentRejectsNegotiated = TRUE
    DetachesBeforeStop = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    FixCloseJoinsTask = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    NoEncoderWhileUnconfirmed
    BarrierPreconditions
    NoAuthorityAtPrepare
    DetachedWhileStopping
    ConsentBoundary
    NoOrphans
    GenerationsSuffice
