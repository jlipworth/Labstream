\* SPEC: PlaybackEmby
\* EXPECT: violation NoOrphans
\* Conditional on Emby behaviour: a PlaybackInfo request the client cancelled is still acted on
\* (AbandonedNegotiateCanLand), and its answer, which nobody hears, counts as a running job as
\* every other answer does. The client never learns the id and sends no stop. Whether a
\* PlaybackInfo answer alone holds an encoder is not established; if not, this is no defect.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    ServerRecreates = TRUE
    IdReuse = "live"
    AbandonedNegotiateCanLand = TRUE
    StopsBeforeNegotiate = TRUE
    WaitsForStopAck = TRUE
    BlocksOnUnconfirmedStop = TRUE
    JoinsPredecessor = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRequiresAck = TRUE
    ConsentRejectsNegotiated = TRUE
    DetachesBeforeStop = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    FixCloseJoinsTask = FALSE
INVARIANTS
    NoOrphans
