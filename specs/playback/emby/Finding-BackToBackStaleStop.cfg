\* SPEC: PlaybackEmby
\* EXPECT: violation StopNeverKillsSuccessor
\* Conditional on Emby behaviour: two controllers and a server that may give the second a
\* play-session id the first one's stopped session had (IdsNeverShared = FALSE, IdReuse =
\* "stopped"). The first controller's stop is applied with its answer lost; its retry is still in
\* flight when the next playback is given the id, and ends it. Deep-BackToBack is this run with
\* every stop answered.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1, c2}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = FALSE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    ServerRecreates = TRUE
    IdReuse = "stopped"
    AbandonedNegotiateCanLand = FALSE
    StopsBeforeNegotiate = TRUE
    WaitsForStopAck = TRUE
    BlocksOnUnconfirmedStop = TRUE
    JoinsPredecessor = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRequiresAck = TRUE
    ConsentRejectsNegotiated = TRUE
    DetachesBeforeStop = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    FixCloseJoinsTask = FALSE
INVARIANTS
    StopNeverKillsSuccessor
