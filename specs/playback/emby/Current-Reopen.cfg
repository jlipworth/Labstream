\* SPEC: PlaybackEmby
\* EXPECT: pass
\* The reopen as it stands. One controller, three reopens or Retry taps, failures, a reopen while
\* a failure shows, stops that end unacknowledged, jobs the server makes again (#421), and a
\* server that never returns a play-session id it has used (IdReuse = "never"). Every stop is
\* answered within its timeout and no consent is needed. StopNeverKillsSuccessor cannot fail
\* without reuse and is not listed; Current-ReopenLive is the run with any id returned.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3, s4}
    MaxGeneration = 15
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 3
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    ServerRecreates = TRUE
    IdReuse = "never"
    AbandonedNegotiateCanLand = FALSE
    StopsBeforeNegotiate = TRUE
    WaitsForStopAck = TRUE
    BlocksOnUnconfirmedStop = TRUE
    JoinsPredecessor = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRequiresAck = TRUE
    ConsentRejectsNegotiated = TRUE
    DetachesBeforeStop = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    FixCloseJoinsTask = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    NoEncoderWhileUnconfirmed
    BarrierPreconditions
    NoAuthorityAtPrepare
    DetachedWhileStopping
    ConsentBoundary
    NoOrphans
    GenerationsSuffice
