\* SPEC: PlaybackBaseSmoke
\* EXPECT: pass
\* Two controllers share the server: neither can start under a session id the other used, and
\* the judgements hold for each. Smaller bounds than Base-Current-Smoke.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1, c2}
    SessionIds = {s1, s2}
    MaxGeneration = 1
    MaxStopSends = 1
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    SmokeReusesIds = FALSE
    SmokeWaitsForStop = TRUE
    SmokeReplaces = TRUE
    SmokeFlagsWindow = TRUE
    SmokeTicketsCleanup = TRUE
INVARIANTS
    TypeOK
    OneEncoder
    NoWrongKill
    JoinCoversCleanup
    OneOwnerPerId
