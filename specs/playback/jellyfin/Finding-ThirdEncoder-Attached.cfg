\* SPEC: PlaybackJellyfin
\* EXPECT: violation OneEncoderWhilePlaying
\* Finding-ThirdEncoder's run, checking OneEncoder only where a replacement plays and nothing is
\* under way, so that the trace is the attached shape: two reopens both attach within the two-second
\* sleep, and the first two sessions run, asleep on their deferred stops, while the third plays. No failures,
\* so that the overlap of Finding-RestartFromFailureOverlap does not come first. No server
\* assumption, and it does not rest on a PlaybackInfo answer counting as an encoder.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = FALSE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = TRUE
    QuickRetry = FALSE
    IdReuse = "never"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoderWhilePlaying
