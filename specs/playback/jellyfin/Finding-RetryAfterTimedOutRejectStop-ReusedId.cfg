\* SPEC: PlaybackJellyfin
\* EXPECT: violation StopNeverKillsSuccessor
\* Conditional on the server (IdReuse = "latest", ReusedIdReplacesJob, StopEndsAllUnderId, as
\* Current-ReusedId) and on a stop the client abandoned still being applied (#536). Current-ReusedId with stops that can outlive their request timeout, the
\* #539 check on. The failed session's own stop is acknowledged, so Retry proceeds; but the
\* reopen the failure cancelled had negotiated the failed session's id again, its rejected
\* result's stop (stopRejectedRemoteStream) times out, the join of that task returns on the
\* timeout, Retry's negotiation gets the id once more, and the rejected result's stop, still on the
\* wire, ends the replacement. The #539 check covers the failed session's stop, not a rejected
\* result's (the RejectedStopKillsReusedId family).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    QuickReopen = FALSE
    QuickRetry = TRUE
    IdReuse = "latest"
    ReusedIdReplacesJob = TRUE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    StopNeverKillsSuccessor
    NoOrphans
    GenerationsSuffice
    IdsSuffice
