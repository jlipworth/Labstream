\* SPEC: PlaybackJellyfin
\* EXPECT: pass
\* Current-ReopenSmall with late stops (StopsCanBeLate = TRUE) and failures together: a stop can
\* outlive its request timeout while Retry and the restart from a failure run. Every Current
\* invariant, OneEncoder included: a restart from a failure joins the failed attempt's stop
\* (#530), and Retry or that restart re-sends a stop that timed out and proceeds only once it
\* is acknowledged (#539).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "never"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    NoOrphans
    GenerationsSuffice
    IdsSuffice
