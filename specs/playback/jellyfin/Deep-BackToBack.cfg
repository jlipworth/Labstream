\* SPEC: PlaybackJellyfin
\* EXPECT: pass
\* TIER: deep
\* Two controllers sharing the server, so a closing playback overlaps the next one. IdsNeverShared
\* = FALSE: nothing confines a play-session id to one controller (the server mints it, and the stop
\* names the device and the id, with one device for both), and with IdReuse = "stopped" the second
\* playback can be given an id the first one's stopped session had. One user action each, failures,
\* failing stops, no consent. StopEndsAllUnderId as in Current-ReusedId.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1, c2}
    SessionIds = {s1, s2, s3, s4}
    MaxGeneration = 10
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = FALSE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "stopped"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    StopNeverKillsSuccessor
    NoOrphans
    GenerationsSuffice
    IdsSuffice
