\* SPEC: PlaybackJellyfin
\* EXPECT: violation StopNeverKillsSuccessor
\* Conditional on the server (IdReuse = "latest", ReusedIdReplacesJob, StopEndsAllUnderId, as
\* Current-ReusedId) and on a stop the client abandoned still being applied (#536).
\* Current-ReusedId with late stops, the #539 check on, and one user action (the Retry tap, so no
\* reopen and not Finding-RetryAfterTimedOutRejectStop-ReusedId's route). The failure's stop times
\* out, the tap re-sends it and the re-send is acknowledged, Retry negotiates and gets the failed
\* session's id back, and the first stop, still on the wire, ends the replacement: an
\* acknowledged second stop does not fence an abandoned first one under a reused id.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    QuickReopen = FALSE
    QuickRetry = TRUE
    IdReuse = "latest"
    ReusedIdReplacesJob = TRUE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    StopNeverKillsSuccessor
    NoOrphans
    GenerationsSuffice
    IdsSuffice
