\* SPEC: PlaybackJellyfin
\* EXPECT: violation StopNeverKillsSuccessor
\* Current-ReusedId - RetryNeedsConfirmedStop (#539), late stops on in both. Conditional on the
\* server (IdReuse = "latest", ReusedIdReplacesJob, StopEndsAllUnderId, as Current-ReusedId). A
\* failure's stop times out, Retry's join returns on the timeout, and without the check the
\* Retry's negotiation gets the failed session's id back and the timed-out stop, still on the
\* wire, ends the replacement.
SPECIFICATION Spec
