\* SPEC: PlaybackJellyfin
\* EXPECT: violation StopNeverKillsSuccessor
\* A quality or track change while a failure shows (RestartFromFailure) negotiates without waiting
\* for the failed attempt's stop, which retry() would have joined. With a server that returns the id
\* it minted last, that stop ends the replacement. QuickReopen lets the change come before the stop
\* is answered.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = TRUE
    QuickRetry = FALSE
    IdReuse = "latest"
    ReusedIdReplacesJob = TRUE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    StopNeverKillsSuccessor
