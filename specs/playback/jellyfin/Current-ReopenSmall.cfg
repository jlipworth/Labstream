\* SPEC: PlaybackJellyfin
\* EXPECT: pass
\* Current-Reopen's smaller run: two user actions, three ids, MaxGeneration = 12, no late stops.
\* The base the other one-controller configs derive from; each Mutant and Finding built on it
\* differs from it in one constant.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "never"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    NoOrphans
    GenerationsSuffice
    IdsSuffice
