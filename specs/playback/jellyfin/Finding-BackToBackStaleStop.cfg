\* SPEC: PlaybackJellyfin
\* EXPECT: violation StopNeverKillsSuccessor
\* Two controllers, IdsNeverShared = FALSE, and a server that returns the id it minted last. The
\* first playback is closed; its final stop is not awaited (UI teardown is non-blocking) and lands
\* on the second playback's job under the same id.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1, c2}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 10
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = FALSE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "latest"
    ReusedIdReplacesJob = TRUE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    StopNeverKillsSuccessor
