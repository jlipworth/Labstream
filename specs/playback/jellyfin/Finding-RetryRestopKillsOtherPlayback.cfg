\* SPEC: PlaybackJellyfin
\* EXPECT: violation StopNeverKillsSuccessor
\* Conditional on the server (#536): IdsNeverShared = FALSE and IdReuse = "stopped" (a second
\* controller on the same device can be given an id whose job has ended), StopEndsAllUnderId, and a
\* stop the client counted as failed (transport error after the server applied it) having ended its
\* job. Deep-BackToBack's constants, at the default tier. c1's failure stop fails but ends A's job;
\* the Retry tap re-sends it (#539, joinFailedAttemptStop -> resendFailedAttemptStop) for an id with
\* nothing running under it; c2 opens and is given A's id; the re-send is acknowledged and ends c2's
\* job. Retry's join fences only c1's own negotiation, not another controller's. Before #539 no
\* stop was sent after the job ended, which is why Deep-BackToBack passed with "stopped" reuse.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1, c2}
    SessionIds = {s1, s2, s3, s4}
    MaxGeneration = 10
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = FALSE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "stopped"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    StopNeverKillsSuccessor
    NoOrphans
    GenerationsSuffice
    IdsSuffice
