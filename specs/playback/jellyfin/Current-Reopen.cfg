\* SPEC: PlaybackJellyfin
\* EXPECT: pass
\* The reopen as it stands. One controller, three reopens or Retry taps, failures, a reopen while
\* a failure shows, stops that end unacknowledged or outlive their timeout, jobs the server
\* recreates, and a server that never returns a used play-session id. No consent is needed, and no
\* reopen or Retry starts while the replace-then-clean-up window is open (QuickReopen = QuickRetry
\* = FALSE; Finding-ThirdEncoder is the run with QuickReopen). StopNeverKillsSuccessor cannot fail
\* without id reuse; Current-ReusedId checks it with reuse.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3, s4}
    MaxGeneration = 15
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 3
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "never"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    StopNeverKillsSuccessor
    NoOrphans
    GenerationsSuffice
    IdsSuffice
