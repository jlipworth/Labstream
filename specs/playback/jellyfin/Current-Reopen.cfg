\* SPEC: PlaybackJellyfin
\* EXPECT: pass
\* The reopen as it stands. One controller, three reopens or Retry taps, failures, a reopen while
\* a failure shows, stops that end unacknowledged, jobs the server recreates, and a server that
\* never returns a used play-session id. Every stop is answered or fails inside its request
\* timeout: a stop past it lets Retry or a restart overlap the failed session
\* (Finding-RetryAfterTimedOutStop); Current-LateStops checks late stops without failures. No
\* consent is needed, and no reopen or Retry starts while cleanup is under way (QuickReopen =
\* QuickRetry = FALSE; Finding-ThirdEncoder is the run with QuickReopen). StopNeverKillsSuccessor
\* cannot fail without id reuse, so it is not listed; Current-ReusedId checks it with reuse.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3, s4}
    MaxGeneration = 15
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 3
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "never"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    FailureRestartJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    NoOrphans
    GenerationsSuffice
    IdsSuffice
