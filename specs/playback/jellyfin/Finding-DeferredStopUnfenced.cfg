\* SPEC: PlaybackJellyfin
\* EXPECT: violation StopNeverKillsSuccessor
\* Suspect 3, reopen path. A second reopen starts while the first one's deferred prior stop
\* sleeps (QuickReopen), and the server returns that prior session's id while its job still runs
\* (IdReuse = "live"). The skip compares only with the immediate predecessor, so the deferred stop
\* goes out and ends the replacement. No failures, and the run stops at any rejected result
\* (CONSTRAINT NoRejection) so that the trace is the deferred stop, not
\* Finding-RejectedStopKillsReusedId.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 2
    EnvFails = FALSE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = TRUE
    QuickRetry = FALSE
    IdReuse = "live"
    ReusedIdReplacesJob = TRUE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    FailureRestartJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    StopNeverKillsSuccessor
CONSTRAINT
    NoRejection
