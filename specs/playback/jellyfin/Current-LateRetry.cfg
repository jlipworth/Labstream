\* SPEC: PlaybackJellyfin
\* EXPECT: pass
\* Current-ReopenSmall with stops that can outlive their request timeout, and no restart while a
\* failure shows (so the route after a failure is Retry; the restart route is
\* Finding-RestartFromFailureOverlap). A failure's stop can fail or time out, and the user may tap
\* Retry after that; Retry then fails with priorSessionStopUnconfirmed (#539). Every Current
\* invariant, OneEncoder included.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "never"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    StopNeverKillsSuccessor
    NoOrphans
    GenerationsSuffice
    IdsSuffice
