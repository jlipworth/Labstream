\* SPEC: PlaybackJellyfin
\* EXPECT: violation OneEncoder
\* Current-ReopenSmall with stops that can outlive their request timeout, and no restart while a
\* failure shows (so the route is Retry). A failure's stop times out, the user taps Retry after it
\* (QuickRetry = FALSE: a stop past its timeout is not cleanup the user waits for), Retry's join
\* returns on the timeout, and the replacement attaches while the failed session's job still runs.
\* No server assumption.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "never"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    StopNeverKillsSuccessor
    NoOrphans
    GenerationsSuffice
    IdsSuffice
