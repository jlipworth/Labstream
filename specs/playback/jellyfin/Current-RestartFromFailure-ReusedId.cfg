\* SPEC: PlaybackJellyfin
\* EXPECT: pass
\* The route of Faithful-RestartFromFailureStaleStop-off with the #530 join on: a server that
\* returns the id it minted last (IdReuse = "latest", ReusedIdReplacesJob), QuickReopen and a
\* quality or track change while a failure shows. The change waits for the failed attempt's stop,
\* so that stop can no longer end the replacement under the reused id. One user action keeps out
\* the two-reopen route of Finding-RejectedStopKillsReusedId, which needs no failure.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = TRUE
    QuickRetry = FALSE
    IdReuse = "latest"
    ReusedIdReplacesJob = TRUE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    FailureRestartJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    StopNeverKillsSuccessor
    NoOrphans
