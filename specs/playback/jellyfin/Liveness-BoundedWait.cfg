\* SPEC: PlaybackJellyfin
\* EXPECT: pass
\* Liveness under ClockFairSpec: no stop is ever answered, only the request timeout runs. Tasks
\* still settle and Close still cleans up. WindowCloses is not checked: a stop nobody awaits is
\* then never answered, so the window it keeps open never closes.
SPECIFICATION ClockFairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2}
    MaxGeneration = 10
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = TRUE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    QuickReopen = FALSE
    QuickRetry = FALSE
    IdReuse = "never"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    RetryNeedsConfirmedStop = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
PROPERTIES
    ReopenSettles
    CloseCleansUp
