\* SPEC: PlaybackJellyfin
\* EXPECT: violation StopNeverKillsSuccessor
\* Conditional on the server (IdReuse = "latest", ReusedIdReplacesJob, StopEndsAllUnderId, as
\* Current-ReusedId). Current-ReusedId with stops that can outlive their request timeout. A
\* failure's stop times out, Retry's join returns on the timeout, the Retry's negotiation gets the
\* failed session's id back, and the timed-out stop, still on the wire, ends the replacement.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = TRUE
    MaxUserActions = 2
    EnvFails = TRUE
    RestartFromFailure = FALSE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = TRUE
    QuickReopen = FALSE
    QuickRetry = TRUE
    IdReuse = "latest"
    ReusedIdReplacesJob = TRUE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
    StopNeverKillsSuccessor
    NoOrphans
    GenerationsSuffice
    IdsSuffice
