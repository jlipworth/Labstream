\* SPEC: PlaybackJellyfin
\* EXPECT: violation OneEncoder
\* Faithfulness check for the #530 fix (was Finding-RestartFromFailureOverlap). Current-ReopenSmall
\* with one user action and QuickReopen, FailureRestartJoinsPendingStops off. A quality or track
\* change while a failure shows reopens without the join retry() has: the failed attempt's stop is still in
\* flight when the replacement attaches, and that session is not a replaced prior, so the overlap
\* lasts past the window. No server assumption; Faithful-RestartFromFailureStaleStop-off is the same
\* route under id reuse.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Controllers = {c1}
    SessionIds = {s1, s2, s3}
    MaxGeneration = 12
    RecreateCountsAgainstServer = TRUE
    IdsNeverShared = TRUE
    StopEndsAllUnderId = FALSE
    MaxUserActions = 1
    EnvFails = TRUE
    RestartFromFailure = TRUE
    ConsentPossible = FALSE
    StopsCanFail = TRUE
    StopsCanBeLate = FALSE
    QuickReopen = TRUE
    QuickRetry = FALSE
    IdReuse = "never"
    ReusedIdReplacesJob = FALSE
    SkipsReusedIdStop = TRUE
    DefersPriorStop = TRUE
    RejectedIsStopped = TRUE
    ConsentStopsSession = TRUE
    ConsentRejectsNegotiated = TRUE
    CloseStopsSession = TRUE
    RetryJoinsPendingStops = TRUE
    FailureRestartJoinsPendingStops = FALSE
    StopTimesOut = TRUE
    WindowEndsWithCleanup = TRUE
    FixCloseJoinsTask = FALSE
    FixTracksDeferredStop = FALSE
    FixConsentStopFenced = FALSE
INVARIANTS
    TypeOK
    OneEncoder
